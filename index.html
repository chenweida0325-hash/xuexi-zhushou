<style>
/* ============ 学习助手 · 基础样式（v3.11：全站深色——课程页与首页同款黑色机械风，首页白卡 3D 封面保留） ============ */
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  /* v3.11 全站暗色板（与首页 #0a1120 系列同族） */
  --bg: #0b1220;
  --card: #0f1b2e;
  --ink: #e2e8f0;
  --muted: #94a3b8;
  --line: rgba(148, 163, 184, .16);
  --primary: #2563eb;
  --primary-soft: rgba(59, 130, 246, .22);
  --accent: #f59e0b;
  --ok: #16a34a;
  --bad: #dc2626;
  --link: #60a5fa;
  --radius: 14px;
  --shadow: 0 1px 3px rgba(2, 6, 16, .45), 0 6px 18px rgba(2, 6, 16, .35);
}
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.6;
  min-height: 100vh;
}

/* ---------- 小程序外壳：顶部导航条（返回 + 居中标题 + 右侧胶囊装饰，v3.15） ---------- */
.mp-bar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; justify-content: space-between;
  height: 48px; padding: 0 10px;
  background: rgba(9, 15, 27, .78);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(148, 163, 184, .16);
}
.mp-title {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  font-size: 16px; font-weight: 700; letter-spacing: 1px; color: #e2e8f0;
  white-space: nowrap; max-width: 52vw; overflow: hidden; text-overflow: ellipsis;
}
.mp-back {
  border: 1.5px solid rgba(148, 163, 184, .3); background: rgba(148, 163, 184, .06);
  color: #cbd5e1; font-size: 13px; padding: 4px 12px; border-radius: 999px; cursor: pointer;
  transition: all .15s;
}
.mp-back:hover { border-color: var(--link); color: var(--link); }
.mp-capsule { display: flex; gap: 5px; }
.mp-capsule i {
  width: 26px; height: 15px; border-radius: 6px;
  border: 1.5px solid rgba(148, 163, 184, .4); background: rgba(148, 163, 184, .08);
}

/* ---------- 布局 ---------- */
main { max-width: 1040px; margin: 0 auto; padding: 16px 14px 96px; }
.view { display: none; }
.view.active { display: block; animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }
.hidden { display: none !important; }
.loading { color: var(--muted); text-align: center; padding: 40px 0; }

/* ---------- 小程序外壳：底部 Tab 栏（v3.15） ---------- */
.mp-tabbar {
  position: fixed; left: 50%; bottom: 0; transform: translateX(-50%);
  width: 100%; max-width: 1040px; z-index: 30;
  display: flex;
  background: rgba(9, 15, 27, .92);
  backdrop-filter: blur(12px);
  border-top: 1px solid rgba(148, 163, 184, .16);
  box-shadow: 0 -6px 18px rgba(2, 6, 16, .35);
}
.mp-tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 1px; padding: 7px 0 8px; text-decoration: none; color: #7c8ba1;
  font-size: 10.5px; letter-spacing: .5px; user-select: none; text-align: center;
}
.mp-tab .ico { font-size: 17px; line-height: 1.2; }
.mp-tab.active { color: #60a5fa; }
.mp-tab.active::after {
  content: ''; width: 15px; height: 3px; border-radius: 2px; margin-top: 3px;
  background: linear-gradient(90deg, #2563eb, #0d9488);
}
.site-foot { padding-bottom: 96px; }

/* ---------- 课程页背景：与首页同一蓝图网格（更淡），内容层盖在网格之上 ---------- */
#view-course { position: relative; }
#view-course::before {
  content: ''; position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(148, 163, 184, .05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(148, 163, 184, .05) 1px, transparent 1px),
    linear-gradient(rgba(148, 163, 184, .08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(148, 163, 184, .08) 1px, transparent 1px);
  background-size: 44px 44px, 44px 44px, 220px 220px, 220px 220px;
  -webkit-mask-image: radial-gradient(ellipse at 50% 20%, #000 30%, transparent 85%);
  mask-image: radial-gradient(ellipse at 50% 20%, #000 30%, transparent 85%);
}
#view-course > * { position: relative; z-index: 1; }

/* ---------- 工具栏 / 筛选 ---------- */
.toolbar { display: flex; gap: 8px; margin: 8px 0 10px; flex-wrap: wrap; }
.search {
  flex: 1 1 220px; min-width: 0; font-size: 14px;
  padding: 9px 14px; border: 1.5px solid rgba(148, 163, 184, .22); border-radius: 999px;
  outline: none; background: #0d1830; color: var(--ink); transition: border .15s;
}
.search::placeholder { color: rgba(148, 163, 184, .5); }
.search:focus { border-color: var(--link); }
.btn {
  border: 1.5px solid var(--line); background: #0d1830; color: var(--ink);
  padding: 7px 14px; border-radius: 999px; font-size: 13px; cursor: pointer;
  transition: all .15s;
}
.btn:hover { border-color: var(--link); color: var(--link); }
.btn.small { padding: 6px 12px; }
.btn.on { background: var(--primary); border-color: var(--primary); color: #fff; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 14px; }
.chips .chip {
  border: 1.5px solid var(--line); background: #0d1830; color: #b6c2d4;
  font-size: 13px; padding: 5px 13px; border-radius: 999px; cursor: pointer;
  transition: all .15s;
}
.chips .chip:hover { border-color: var(--link); color: var(--link); }
.chips .chip.on { background: var(--primary-soft); border-color: rgba(96, 165, 250, .55); color: #93c5fd; font-weight: 600; }
.chips.small-chips .chip { font-size: 12px; padding: 4px 11px; }

/* ---------- 首页：四张封面（2×2 大卡片 + 黑色机械风装饰背景） ---------- */
#view-home {
  position: relative;
  min-height: calc(100vh - 128px);
  /* 居中列布局只在激活态生效：ID 级 display 会压过 .view{display:none}，
     若写在这里，点封面进课程后首页（报头+封面）仍会叠在课程内容上方，必须往下滚才能看到公式/习题 */
  flex-direction: column; align-items: center; justify-content: center;
  padding: 6px 0 40px;
  background:
    radial-gradient(900px 520px at 15% 6%, rgba(59, 130, 246, .16), transparent 62%),
    radial-gradient(820px 480px at 86% 8%, rgba(139, 92, 246, .15), transparent 62%),
    radial-gradient(1000px 560px at 82% 96%, rgba(217, 119, 6, .13), transparent 62%),
    radial-gradient(760px 440px at 14% 94%, rgba(45, 212, 191, .13), transparent 62%),
    linear-gradient(180deg, #0a1120 0%, #0d1524 56%, #0a101e 100%);
}
#view-home.active { display: flex; } /* 仅首页路由激活时启用 flex 布局 */
.home-bg { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
/* 蓝图网格：44px 细格 + 220px 粗格，中心清晰、四周渐隐 */
.home-bg::before {
  content: ''; position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(148, 163, 184, .075) 1px, transparent 1px),
    linear-gradient(90deg, rgba(148, 163, 184, .075) 1px, transparent 1px),
    linear-gradient(rgba(148, 163, 184, .12) 1px, transparent 1px),
    linear-gradient(90deg, rgba(148, 163, 184, .12) 1px, transparent 1px);
  background-size: 44px 44px, 44px 44px, 220px 220px, 220px 220px;
  -webkit-mask-image: radial-gradient(ellipse at 50% 38%, #000 28%, transparent 82%);
  mask-image: radial-gradient(ellipse at 50% 38%, #000 28%, transparent 82%);
}
/* 暗角：把四周压暗，让中部封面「浮」出来 */
.home-bg::after {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(130% 95% at 50% 35%, transparent 52%, rgba(2, 6, 16, .5) 100%);
}
/* v4.2：背景水印线稿已移除，仅保留蓝图网格（::before）与暗角（::after） */
@media (prefers-reduced-motion: reduce) {
  .c3d, .cover-card, .cover-card .cc-shine, .cover-card img.cc-cover,
  .cc-plates, .cc-plates::before, .cc-plates::after { transition: none; }
}

/* v3.11：全站统一暗色——原首页专用的 :has 暗色规则已合并进顶栏/页脚/组件基座样式 */

/* 首页报头（深色版） */
.home-hero {
  position: relative; z-index: 1; text-align: center; margin: 0 0 26px;
  border-radius: 999px; padding: 10px 26px 14px;
  background: radial-gradient(500px 130px at 50% 58%, rgba(30, 64, 175, .34), transparent 72%);
}
.hh-title {
  font-size: 36px; font-weight: 800; letter-spacing: 2px; line-height: 1.2;
  color: #e2e8f0;
}
.hh-title .hh-logo { margin-right: 4px; }
@supports ((background-clip: text) or (-webkit-background-clip: text)) {
  .hh-title {
    background: linear-gradient(92deg, #60a5fa 10%, #2dd4bf 52%, #fbbf24 94%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  .hh-title .hh-logo { -webkit-text-fill-color: transparent; }
}
.hh-sub { font-size: 13.5px; color: #94a3b8; letter-spacing: 3px; margin-top: 8px; }
.home-hero::after {
  content: ''; display: block; width: 72px; height: 3px; margin: 14px auto 0;
  border-radius: 2px; background: linear-gradient(90deg, #60a5fa, #2dd4bf, #fbbf24);
  box-shadow: 0 0 12px rgba(56, 189, 248, .55);
}

.home-grid {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px;
  width: 100%; align-items: stretch;
  position: relative; z-index: 1;
  /* 3D 透视起点：整张封面（含厚度层）在 hover 时朝鼠标方向微微倾斜 */
  perspective: 1100px;
}
/* 3D 封面容器：网格单元。卡片 + 外部厚度层包在一起，倾斜时整体转动；
   position:relative 且 z-index:auto → 不构成层叠上下文，
   厚度层（z-index:-1）才会在网格层叠上下文里排在卡片白底之下 */
.c3d { position: relative; }
.c3d > .cover-card { height: 100%; }
.cover-card {
  position: relative; display: flex; flex-direction: column; text-decoration: none; color: inherit;
  background: var(--card); border: 1px solid var(--line); border-radius: 20px;
  box-shadow: 0 4px 8px -3px rgba(15, 23, 42, .14), 0 22px 40px -14px rgba(15, 23, 42, .22);
  border-top: 4px solid var(--cc, var(--primary));
  transition: box-shadow .22s, border-color .22s;
  will-change: transform;
}
/* 3D 厚度：两层同色系「侧板」错位叠在卡片背后（向右/下伸出）。
   必须是卡片的兄弟（不能作卡片子元素）：z-index:-1 只排在兄弟之下，
   若作子元素会盖在不透明的卡片白底之上。用 2D translate 而非 translateZ：
   网格透视会把远离消失点一侧的 Z 向侧板投影缩进卡片背后，靠右/靠下的
   卡片静止时会看不出厚度；2D 叠层四张卡都稳定可见 */
.cc-plates { position: absolute; inset: 0; z-index: -1; border-radius: 20px; }
.cc-plates::before, .cc-plates::after {
  content: ''; position: absolute; inset: 0; border-radius: inherit;
}
.cc-plates::before { /* 第一层厚度（浅） */
  background: var(--cc-plate, var(--cc));
  border-radius: 5px; /* 圆角必须远小于外露量：20px 圆角会把 6-12px 的厚度条整个裁掉 */
  transform: translate(7px, 9px);
}
.cc-plates::after {  /* 第二层厚度（深）+ 落地投影 */
  background: var(--cc-deep, var(--cc));
  border-radius: 10px;
  transform: translate(14px, 18px);
  box-shadow: 0 18px 34px -10px rgba(15, 23, 42, .38);
}
.c3d:hover { transform: translateY(-6px); } /* JS 倾斜接管时会被内联 transform 覆盖；无 JS 时保留上浮 */
.cover-card:hover {
  border-color: transparent;
  box-shadow: 0 12px 22px -8px rgba(15, 23, 42, .16), 0 30px 52px -16px var(--cc, var(--primary));
}
.c3d:hover .cc-plates::after { box-shadow: 0 26px 40px -12px rgba(15, 23, 42, .45); }
.cover-card img.cc-cover {
  display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover;
  object-position: center; border-bottom: 1px solid var(--line);
  /* overflow:hidden 移除后，顶角圆角改由图片自己带 */
  border-radius: 19px 19px 0 0;
  /* 封面图「悬浮在卡面之前」：自带 3D 投影放大一点点 + 投影，不需父级 preserve-3d */
  transform: perspective(900px) translateZ(16px);
  filter: drop-shadow(0 10px 12px rgba(15, 23, 42, .20));
  transition: filter .2s;
}
.cover-card:hover img.cc-cover {
  filter: brightness(1.05) saturate(1.08) drop-shadow(0 14px 18px rgba(15, 23, 42, .22));
}
/* 镜面高光：hover 时从封面右下方扫过一道光 */
.cc-shine {
  position: absolute; inset: 0; z-index: 3; pointer-events: none;
  border-radius: 20px;
  background: linear-gradient(115deg, transparent 32%, rgba(255, 255, 255, .5) 50%, transparent 68%);
  opacity: 0; transition: opacity .25s;
}
.cover-card:hover .cc-shine, .cover-card:focus-visible .cc-shine { opacity: 1; }
.cover-card:focus-visible { outline: 2px solid var(--cc, var(--primary)); outline-offset: 3px; }
.cc-body { padding: 14px 18px 16px; display: flex; flex-direction: column; gap: 7px; flex: 1; }
.cc-name {
  font-size: 22px; font-weight: 800; color: var(--cc, var(--primary)); letter-spacing: .5px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.cc-name .cc-go { font-size: 13px; font-weight: 600; font-style: normal; color: var(--muted); white-space: nowrap; transition: transform .2s, color .2s; }
.cover-card:hover .cc-name .cc-go { transform: translateX(4px); color: var(--cc, var(--primary)); }
/* v4.2：cc-desc（课程简介）与首页卡片计数行 cc-meta 已移除 */
/* 全站暗色后回钉首页封面为白卡（深底白卡保持既有对比，
   也保证 3D 厚度层 z-index:-1 排序与 plate3D 断言稳定） */
.cover-card { background: #ffffff; border-color: #e2e8f0; color: #1e293b; }
.cover-card .cc-name .cc-go { color: #64748b; }

/* ---------- 课程页：课程头 + 双标签 ---------- */
.co-head {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden; margin: 6px 0 12px;
  border-top: 4px solid var(--cc, var(--primary));
}
.co-banner { display: block; width: 100%; height: 148px; object-fit: cover; object-position: center; border-bottom: 1px solid var(--line); }
.co-head-in { padding: 12px 16px 14px; }
.co-crumb { font-size: 12.5px; color: var(--muted); margin-bottom: 6px; display: block; }
.co-crumb a { color: var(--link); text-decoration: none; }
.co-crumb a:hover { text-decoration: underline; }
.co-title-row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.co-emoji { font-size: 20px; }
/* 暗色下课程标题用每课浅色变体（app.js 注入 --cc-plate）保证对比 */
.co-title { font-size: 18px; font-weight: 800; color: var(--cc-plate, var(--cc)); }
.co-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.co-counts { display: flex; gap: 8px; margin-top: 9px; flex-wrap: wrap; }
.co-counts .chip { cursor: default; }

.ctabs { display: flex; gap: 6px; margin: 0 0 4px; }
.ctab {
  flex: 1; text-align: center; text-decoration: none; color: #b6c2d4;
  background: #0d1830; border: 1.5px solid var(--line); padding: 9px 0;
  border-radius: 999px; font-size: 14px; font-weight: 600; transition: all .15s;
}
.ctab:hover { border-color: var(--link); color: var(--link); }
.ctab.active { background: var(--primary); border-color: var(--primary); color: #fff; }

/* ---------- 课程页 · 公式分组（v4.4：分组间距放宽） ---------- */
.cat-block { margin-top: 26px; }
.cat-block:first-child { margin-top: 8px; }
.cat-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 15.5px; font-weight: 700; margin-bottom: 8px; }
.cat-head .chip { font-size: 11px; padding: 2px 8px; cursor: default; font-weight: 400; }
.cat-intro { font-size: 12.5px; color: var(--muted); line-height: 1.75; margin-bottom: 12px; }

/* ---------- 卡片（v4.4 留白呼吸感：间距/行高加大、次要信息灰色弱化） ---------- */
.cards-wrap { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 20px 22px;
  display: flex; flex-direction: column; gap: 10px;
}
.chip.course-chip { font-size: 12px; padding: 3px 10px; background: var(--primary-soft); border-color: transparent; color: #93c5fd; cursor: default; }
.favbtn {
  border: none; background: none; font-size: 18px; cursor: pointer; line-height: 1;
  color: #64748b; transition: transform .12s, color .12s; padding: 2px 4px;
}
.favbtn:hover { transform: scale(1.2); }
.favbtn.on { color: var(--accent); }

/* ---------- 习题卡（v3.12 考试风习题；v4.4：题干行距放宽、卡片留白加大） ---------- */
.case-card .cc-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cc-name { font-size: 15.5px; font-weight: 700; line-height: 1.5; }
.cc-badge { font-size: 11px; background: rgba(245, 158, 11, .16); color: #fcd34d; border-radius: 6px; padding: 2px 8px; white-space: nowrap; }
.case-card .cc-sub { font-size: 12px; color: var(--muted); }
.cc-diff { color: #fbbf24; letter-spacing: 1px; }
.case-card .highlight {
  font-size: 13.5px; color: #e2e8f0; line-height: 1.8;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.cc-fmlinks { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 11.5px; color: var(--muted); }
.cc-fmlink {
  font-size: 11.5px; line-height: 1.3; text-align: left; color: var(--link);
  background: rgba(96, 165, 250, .08); border: 1px dashed rgba(96, 165, 250, .45);
  border-radius: 999px; padding: 3px 10px; cursor: pointer; transition: all .15s;
}
.cc-fmlink:hover { background: var(--primary); border-color: var(--primary); color: #fff; }
.cc-meta { font-size: 11.5px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.cc-open { margin-top: 4px; text-align: right; }
.cc-open button {
  border: 1.5px solid rgba(96, 165, 250, .6); color: #93c5fd; background: rgba(96, 165, 250, .1);
  font-size: 12.5px; border-radius: 999px; padding: 6px 16px; cursor: pointer; transition: all .15s;
}
.cc-open button:hover { background: var(--primary); border-color: var(--primary); color: #fff; }

/* ---------- 弹窗 ---------- */
.modal {
  position: fixed; inset: 0; background: rgba(2, 6, 16, .62);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 24px 12px; z-index: 50; overflow-y: auto;
}
.modal.hidden { display: none; }
.modal-box {
  background: var(--card); border: 1px solid var(--line); border-radius: 16px; max-width: 620px; width: 100%;
  padding: 20px 20px 22px; position: relative; box-shadow: 0 20px 50px rgba(0, 0, 0, .55);
}
.modal-close {
  position: absolute; top: 10px; right: 12px; border: none; background: #1e293b;
  width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 14px; color: var(--muted);
}
.modal-close:hover { background: #334155; }
.modal h2 { font-size: 18px; padding-right: 30px; margin-bottom: 8px; }
.modal .meta { font-size: 12.5px; color: var(--muted); margin-bottom: 10px; }
.modal .m-field { margin: 10px 0; }
.modal .m-field h4 { font-size: 13px; color: var(--link); margin-bottom: 3px; }
.modal .m-field p { font-size: 13.5px; color: #cbd5e1; }
.modal .m-points { background: rgba(148, 163, 184, .07); border: 1px solid rgba(148, 163, 184, .14); border-radius: 10px; padding: 10px 12px; margin: 6px 0; }
.modal .m-points b { color: #93c5fd; font-size: 13px; }
.modal .m-note { background: rgba(245, 158, 11, .1); border: 1px solid rgba(251, 191, 36, .4); border-radius: 10px; padding: 10px 12px; font-size: 13px; color: #fde68a; white-space: pre-wrap; }
.modal .m-link a { color: var(--link); font-size: 13px; word-break: break-all; }
.modal .m-formula { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; margin: 8px 0; }
.modal .m-formula .fml { width: 100%; box-sizing: border-box; margin: 0; }

/* ---------- 公式卡（v4.4：标题做主角、公式块强化、次要信息灰色弱化） ---------- */
.formula-card { scroll-margin-top: 92px; } /* 公式联动定位：避开固定顶栏 */
.formula-card h3 { font-size: 16px; line-height: 1.5; margin-top: 2px; }
.fc-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.fc-head .favbtn { margin-left: auto; }
.chip.cat-chip { font-size: 11px; padding: 3px 9px; background: #0d1830; border-color: var(--line); color: var(--muted); cursor: pointer; }
.chip.cat-chip:hover { border-color: var(--link); color: var(--link); }
.fml {
  font-family: "Cambria Math", "Times New Roman", Georgia, "Microsoft YaHei", serif;
  font-size: 15.5px; line-height: 1.9; background: #0b1526; color: #f1f5f9;
  border: 1px solid rgba(148, 163, 184, .22); /* 与深色卡片区分边界 */
  border-radius: 12px; padding: 14px 16px; margin: 4px 0 6px; overflow-x: auto;
  white-space: pre-wrap; word-break: break-word; letter-spacing: .3px;
}
.formula-card .params { font-size: 12px; color: #7c8ba1; line-height: 1.8; }
.formula-card .tip { font-size: 12px; color: #fbbf24; background: rgba(245, 158, 11, .12); padding: 9px 12px; line-height: 1.8; border-radius: 10px; }
.formula-card .mnemonic {
  font-size: 12.5px; font-weight: 600; color: #6ee7b7; background: rgba(16, 185, 129, .1);
  border: 1px dashed rgba(52, 211, 153, .45); padding: 9px 12px; line-height: 1.8; border-radius: 10px;
}

/* 公式联动高亮：脉冲光圈 2 次后自动消退 */
@keyframes fmlPulse {
  0% { box-shadow: 0 0 0 0 rgba(96, 165, 250, .55); }
  100% { box-shadow: 0 0 0 18px rgba(96, 165, 250, 0); }
}
.formula-card.fml-hl { border-color: var(--link); animation: fmlPulse .9s ease-out 2; }

/* ---------- 页脚 ---------- */
.site-foot { text-align: center; color: #7c8ba1; font-size: 12px; padding: 18px 14px 26px; }
.site-foot code { background: rgba(148, 163, 184, .14); color: #cbd5e1; padding: 1px 6px; border-radius: 5px; }

/* ---------- 错误提示条 ---------- */
.err-banner {
  position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 999;
  background: #7f1d1d; color: #fff; font-size: 12.5px; padding: 9px 12px;
  border-radius: 10px; box-shadow: 0 4px 14px rgba(0,0,0,.3); white-space: pre-wrap;
}

/* ---------- 第二课堂学分栏目（v4.1） ---------- */
.cred-head {
  background: linear-gradient(160deg, rgba(29, 78, 216, .18), rgba(15, 23, 42, .25) 55%);
  border: 1px solid rgba(96, 165, 250, .25); border-radius: var(--radius);
  padding: 14px 15px; margin-bottom: 14px; box-shadow: var(--shadow);
}
.cred-title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.cred-title-row .chip { font-size: 11.5px; padding: 3px 10px; }

.cred-progress { margin-top: 12px; }

.cred-nums i { color: var(--muted); font-style: normal; }
.cred-meter { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.cred-meter .chip { font-size: 11.5px; padding: 3px 10px; cursor: default; }
.cred-block { margin-bottom: 14px; }
.cred-block-head {
  display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
  font-size: 14.5px; margin: 4px 2px 10px;
}
.cred-block-head b { font-size: 15.5px; letter-spacing: .5px; }
.cred-block-head span { font-size: 12px; color: var(--muted); }
.cred-parts { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }

.credit-part.done { border-color: rgba(74, 222, 128, .45); }
.credit-part.done .cp-name { color: #4ade80; }
.credit-part.drop { border-color: var(--link); box-shadow: 0 0 0 3px rgba(96, 165, 250, .18); }
.cp-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cp-name { font-size: 15.5px; font-weight: 700; }
.cp-head .chip { font-size: 11.5px; padding: 3px 10px; cursor: default; }
.cp-done {
  margin-left: auto;
  border: 1.5px solid var(--line); background: #0d1830; color: var(--muted);
  font-size: 12px; padding: 4px 11px; border-radius: 999px; cursor: pointer; transition: all .15s;
}
.cp-done:hover { border-color: var(--ok); color: var(--ok); }
.cp-done.on { background: rgba(22, 163, 74, .18); border-color: rgba(74, 222, 128, .6); color: #4ade80; font-weight: 600; }
.cp-desc { font-size: 12.5px; color: var(--muted); line-height: 1.65; }
.cp-files { display: flex; flex-direction: column; gap: 7px; margin-top: 2px; }
.cp-empty {
  font-size: 12.5px; color: #64748b; padding: 10px 12px;
  border: 1.5px dashed rgba(148, 163, 184, .28); border-radius: 10px;
}
.cp-file {
  display: flex; align-items: center; gap: 8px;
  background: #0d1830; border: 1px solid rgba(148, 163, 184, .16);
  border-radius: 10px; padding: 7px 10px;
}
.cf-ic { font-size: 19px; }
.cf-info { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; line-height: 1.35; }
.cf-info b { font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cf-info i { font-size: 11px; color: var(--muted); font-style: normal; }
.cf-dl, .cf-del {
  flex: none;
  border: 1.5px solid var(--line); background: none; color: var(--muted);
  font-size: 11.5px; padding: 4px 10px; border-radius: 999px; cursor: pointer; transition: all .15s;
}
.cf-dl:hover { border-color: var(--link); color: var(--link); }
.cf-del:hover { border-color: var(--bad); color: var(--bad); }
.cp-actions { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
.cp-dragtip { font-size: 11.5px; color: #64748b; }
.cred-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.cred-tools .btn { font-size: 12.5px; padding: 6px 13px; }
.cred-hint { width: 100%; font-size: 12px; color: var(--muted); margin-top: 2px; }
.cred-warn {
  width: 100%; font-size: 12.5px; color: #fca5a5;
  background: rgba(220, 38, 38, .12); border: 1px solid rgba(220, 38, 38, .35);
  padding: 8px 11px; border-radius: 10px;

        <div class="cred-block-head"><b>✅ 四选二（1 学分）</b><span>任选 2 类修满即可，各 0.5 学分</span></div>
        <div class="cred-parts">${elect.map((p) => partCardHTML(p, creditStore.list(p.id))).join('')}</div>
      </div>`);
    const warns = [];
    if (creditWarnMsg) warns.push(creditWarnMsg);
    if (creditStore.broken()) warns.push('当前环境不支持持久保存（如单文件离线 / 隐私模式），文件仅本次打开有效，建议使用在线版');
    $('#cred-list').innerHTML = `
      <div class="cred-head">
        <div class="cred-title-row">
          <span class="cred-emoji">🎖️</span>
          <span class="cred-title">${esc(C.title || '第二课堂学分')}</span>
          ${C.target ? `<span class="chip on">${esc(C.targetNote || C.target)}</span>` : ''}
        </div>
        ${C.rule ? `<p class="cred-rule">📜 ${esc(C.rule)}</p>` : ''}
        <div class="cred-progress">
          <div class="cred-bar"><i style="width:${pct}%"></i></div>
          <div class="cred-nums"><b>${fmtNum(pg.got)} / ${fmtNum(total)} 学分</b><i>已获 ${pct}% · 还差 ${fmtNum(remain)}</i></div>
        </div>
        <div class="cred-meter">
          <span class="chip">必修已勾 ${pg.doneReq}/3</span>
          <span class="chip">四选二已勾 ${pg.doneElect}/4（勾满任意 2 类＝1 学分）</span>
        </div>
      </div>
      ${blocks.join('')}
      <div class="cred-tools">
        <button id="cred-export" class="btn">📤 导出备份</button>
        <button id="cred-import-click" class="btn">📥 导入备份（覆盖）</button>
        <p class="cred-hint">💾 文件只保存在本机浏览器，他人访问看不到你的文件；换设备请「导出备份 → 新设备导入」。</p>
        ${warns.length ? `<p class="cred-warn">⚠️ ${warns.map(esc).join('；')}</p>` : ''}
      </div>`;
  }

  /* ---------- 状态 ---------- */
  const S = {
    view: 'home',
    course: { id: null, tab: 'formula' },
    formula: { cat: 'all', q: '', favOnly: false },
    cases: { cate: '全部', scene: '全部', q: '' },
    credits: { pending: null }
  };
  let keepQ = false; // 案例弹窗「知识点跳转」：切到目标课程时保留搜索词

  /* ---------- 数据辅助 ---------- */
  // 拍平：课程 → 分类 → 公式，每条带 cat/course 引用
  function allFormulas() {
    const out = [];
    COURSES.forEach((c) => (c.categories || []).forEach((cat) => (cat.formulas || []).forEach((f) => {
      out.push(Object.assign({}, f, { cat: cat, course: c }));
    })));
    return out;
  }
  function formulaHaystack(f) {
    return [f.title, f.formula, f.params, f.tip, f.mnemonic, f.cat.name, f.course.name].join(' ').toLowerCase();
  }
  function courseById(id) { return COURSES.find((c) => c.id === id); }
  function catCount(c) { return (c.categories || []).length; }
  function formulaCount(c) { return (c.categories || []).reduce((n, cat) => n + (cat.formulas || []).length, 0); }
  function casesOf(courseId) { return CASES.filter((c) => c.course === courseId); }
  // v3.12 习题·公式联动辅助
  function formulaById(id) { return allFormulas().find((f) => f.id === id) || null; }
  function catNameOf(courseId, catId) {
    const c = courseById(courseId);
    const cat = c && (c.categories || []).find((x) => x.id === catId);
    return cat ? cat.name : '';
  }
  function stars(n) { n = Math.max(1, Math.min(3, n || 1)); return '★'.repeat(n) + '☆'.repeat(3 - n); }

  /* ---------- 路由 ---------- */
  function goHash(h) {
    h = h || location.hash || '#/';
    try { if (location.hash !== h) location.hash = h; } catch (err) { /* 个别环境禁止改 hash */ }
    route(h);
  }
  function route(forceHash) {
    // forceHash 只接受字符串；hashchange 事件回调不能把 Event 对象传进来
    let h = (typeof forceHash === 'string' && forceHash) || location.hash || '';
    const seg = h.replace(/^#\/?/, '').split('/').filter(Boolean);
    if (seg[0] === 'course') {
      const c = courseById(seg[1]);
      if (c) { routeView('course', c, seg[2] === 'cases' ? 'cases' : 'formula'); return; }
    }
    if (seg[0] === 'credits') { routeView('credits'); return; }
    // 无 hash / 未知路由一律回首页（四张封面）
    routeView('home');
  }
  function routeView(v, course, tab) {
    if (v === 'course' && course) {
      if (!S.course.id || S.course.id !== course.id) {
        // 切换课程：清掉跨课筛选（防止旧筛选把新课程筛空）；知识点跳转时保留搜索词
        S.course.id = course.id;
        S.formula.cat = 'all';
        S.formula.favOnly = false;
        S.cases.cate = '全部';
        S.cases.scene = '全部';
        if (!keepQ) S.formula.q = '';
      }
      S.course.tab = tab;
    }
    keepQ = false;
    S.view = v;
    $$('.view').forEach((s) => s.classList.toggle('active', s.id === 'view-' + v));
    // 小程序外壳：标题 / 返回键 / 底部 Tab 高亮
    $('#mp-title').textContent = v === 'course' && course ? course.name : (v === 'credits' ? '第二课堂学分' : '学习助手');
    $('#mp-back').classList.toggle('hidden', v === 'home');
    const tabName = v === 'course' ? 'course' : (v === 'credits' ? 'credits' : 'home');
    $$('#mp-tabbar .mp-tab').forEach((a) => a.classList.toggle('active', a.getAttribute('data-tab') === tabName));
    ({ home: renderHome, course: renderCourse, credits: renderCredits })[v]();
    window.scrollTo({ top: 0 });
  }

  /* ---------- 首页：只有四张封面 ---------- */
  function renderHome() {
    $('#home-list').innerHTML = COURSES.map((c) => {
      const t = CC3D[c.id] || { plate: c.color, deep: c.color };
      return `
      <div class="c3d">
        <a class="cover-card" href="#/course/${esc(c.id)}" style="--cc:${esc(c.color)};--cc-plate:${esc(t.plate)};--cc-deep:${esc(t.deep)}">
          ${c.cover ? `<img class="cc-cover" src="${esc(c.cover)}" alt="${esc(c.name)} 封面" loading="lazy">` : ''}
          <span class="cc-body">
            <b class="cc-name">${c.emoji} ${esc(c.name)} <span class="cc-go">进入 ▸</span></b>
          </span>
          <span class="cc-shine" aria-hidden="true"></span>
        </a>
        <!-- 厚度层：卡片的外部兄弟（z-index:-1），排在卡片不透明白底之下，只露出四周厚度 -->
        <span class="cc-plates" aria-hidden="true"></span>
      </div>`;
    }).join('');
  }

  /* ---------- 课程页：公式速记 + 习题案例 ---------- */
  function renderCourse() {
    const c = courseById(S.course.id);
    if (!c) { routeView('home'); return; }
    const nf = formulaCount(c);
    const nc = casesOf(c.id).length;

    // 课程头：封面横幅 + 课名/教材/简介 + 计数（--cc-plate：暗色主题下标题的每课浅色变体）
    const t = CC3D[c.id] || { plate: c.color, deep: c.color };
    $('#course-head').innerHTML = `
      <div class="co-head" style="--cc:${esc(c.color)};--cc-plate:${esc(t.plate)};--cc-deep:${esc(t.deep)}">
        ${c.cover ? `<img class="co-banner" src="${esc(c.cover)}" alt="${esc(c.name)} 封面" loading="lazy">` : ''}
        <div class="co-head-in">
          <span class="co-crumb"><a href="#/">← 返回首页</a> · ${esc(c.name)}</span>
          <div class="co-title-row">
            <span class="co-emoji">${c.emoji}</span>
            <span class="co-title">${esc(c.name)}</span>
          </div>
          <div class="co-sub">${esc(c.book)}${c.desc ? ' · ' + esc(c.desc) : ''}</div>
          <div class="co-counts">
            <span class="chip on">🧮 公式速记 ${nf} 条</span>
            <span class="chip on">✏️ 习题练习 ${nc} 道</span>
          </div>
        </div>
      </div>`;

    // 双标签
    $('#course-tabs').innerHTML = `
      <a class="ctab ${S.course.tab === 'formula' ? 'active' : ''}" href="#/course/${esc(c.id)}">🧮 公式速记（${nf}）</a>
      <a class="ctab ${S.course.tab === 'cases' ? 'active' : ''}" href="#/course/${esc(c.id)}/cases">✏️ 习题练习（${nc}）</a>`;

    // 标签页显隐
    $('#co-formula-pane').classList.toggle('hidden', S.course.tab !== 'formula');
    $('#co-cases-pane').classList.toggle('hidden', S.course.tab !== 'cases');

    renderFormulaPane(c);
    renderCasesPane(c);
  }

  function renderFormulaPane(c) {
    // 搜索框是静态 DOM：只同步值，不重建（保住输入焦点）
    $('#cof-search').value = S.formula.q;
    $('#cof-favtoggle').classList.toggle('on', S.formula.favOnly);

    // 本课分类 chips（点任一分类只看该分类）
    $('#cof-cats').innerHTML =
      `<span class="chip ${S.formula.cat === 'all' ? 'on' : ''}" data-setcat="all">📚 全部分类（${formulaCount(c)}）</span>` +
      c.categories.map((cat) =>
        `<span class="chip ${S.formula.cat === cat.id ? 'on' : ''}" data-setcat="${esc(cat.id)}">${cat.emoji} ${esc(cat.name)}（${(cat.formulas || []).length}）</span>`).join('');

    let list = allFormulas().filter((f) => f.course.id === c.id);
    if (S.formula.cat !== 'all') list = list.filter((f) => f.cat.id === S.formula.cat);
    if (S.formula.q) { const q = S.formula.q.toLowerCase(); list = list.filter((f) => formulaHaystack(f).indexOf(q) >= 0); }
    if (S.formula.favOnly) list = list.filter((f) => fav.formulas.has(f.id));

    if (!S.formula.q && !S.formula.favOnly && S.formula.cat === 'all') {
      // 默认：按本课分类分组展示全部公式
      $('#cof-list').innerHTML = c.categories.map((cat) => {
        const fs = list.filter((f) => f.cat.id === cat.id);
        return `
        <div class="cat-block">
          <div class="cat-head">
            ${cat.emoji} ${esc(cat.name)}
            ${cat.chapter ? `<span class="chip">📖 ${esc(cat.chapter)}</span>` : ''}
            <span class="chip">${fs.length} 条</span>
          </div>
          ${cat.intro ? `<p class="cat-intro">${esc(cat.intro)}</p>` : ''}
          ${fs.length ? cardsHTML(fs) : '<p class="loading">该分类暂无公式</p>'}
        </div>`;
      }).join('');
    } else {
      $('#cof-list').innerHTML = cardsHTML(list, '没有找到匹配的公式，换个词试试' + (S.formula.favOnly ? '（或取消「只看收藏」）' : ''));
    }
  }

  function renderCasesPane(c) {
    $('#coc-search').value = S.cases.q;
    const list0 = casesOf(c.id);
    // 第一行 chips = 知识点分类（本课分类顺序去重），第二行 = 题型
    const catIds = ['全部'].concat(Array.from(new Set(list0.map((x) => x.cat).filter((v) => v))));
    const cates = catIds.map((id) => (id === '全部' ? '全部' : catNameOf(c.id, id) || id));
    const types = ['全部'].concat(Array.from(new Set(list0.map((x) => x.type).filter((v) => v))));
    $('#coc-cates').innerHTML = catIds.map((id, i) =>
      `<span class="chip ${S.cases.cate === id ? 'on' : ''}" data-casecate="${esc(id)}">${esc(cates[i])}</span>`).join('');
    $('#coc-scenes').innerHTML = types.map((t) =>
      `<span class="chip ${S.cases.scene === t ? 'on' : ''}" data-casescene="${esc(t)}">${esc(t)}</span>`).join('');
    let list = list0.slice();
    if (S.cases.cate !== '全部') list = list.filter((x) => x.cat === S.cases.cate);
    if (S.cases.scene !== '全部') list = list.filter((x) => x.type === S.cases.scene);
    if (S.cases.q) {
      const q = S.cases.q.toLowerCase();
      list = list.filter((x) =>
        (x.title + x.body + x.answer + x.step + (x.pitfall || '') + x.type + catNameOf(c.id, x.cat)).toLowerCase().indexOf(q) >= 0);
    }
    $('#coc-list').innerHTML = list.length
      ? list.map(exerciseCardHTML).join('')
      : `<p class="loading">${list0.length ? '没有找到匹配的习题，换个关键词试试' : '本课暂无配套习题，可先看「公式速记」，或到其他课程逛逛'}</p>`;
  }

  /* ---------- 卡片 ---------- */
  function cardsHTML(list, emptyMsg) {
    if (!list.length) return `<p class="loading">${emptyMsg || '没有找到匹配的公式，换个词试试'}</p>`;
    return `<div class="cards-wrap">${list.map(formulaCardHTML).join('')}</div>`;
  }
  function formulaCardHTML(f) {
    const isFav = fav.formulas.has(f.id);
    return `
      <article class="card formula-card" data-id="${esc(f.id)}">
        <div class="fc-head">
          <span class="chip course-chip">${f.course.emoji} ${esc(f.course.name)}</span>
          <span class="chip cat-chip" data-setcat="${esc(f.cat.id)}" title="只看该分类">${f.cat.emoji} ${esc(f.cat.name)}</span>
          <button class="favbtn ${isFav ? 'on' : ''}" data-type="formula" data-id="${esc(f.id)}">${isFav ? '★' : '☆'}</button>
        </div>
        <h3>${esc(f.title)}</h3>
        <pre class="fml">${esc(f.formula)}</pre>
        ${f.params ? `<div class="params">变量：${esc(f.params)}</div>` : ''}
        ${f.tip ? `<div class="tip">💡 ${esc(f.tip)}</div>` : ''}
        ${f.mnemonic ? `<div class="mnemonic">🗝️ ${esc(f.mnemonic)}</div>` : ''}
      </article>`;
  }
  // v3.12 习题卡：题干 + 题型 + 难度 + 「涉及公式」按钮（点击直达公式速记并高亮）
  function exerciseCardHTML(x) {
    const isFav = fav.cases.has(x.id);
    const catName = catNameOf(x.course, x.cat) || '';
    const links = (x.formulas || []).map((fid) => {
      const f = formulaById(fid);
      return f ? `<button class="cc-fmlink" data-goto-formula="${esc(f.id)}">${esc(f.title)}</button>` : '';
    }).join('');
    return `
      <article class="card case-card" data-id="${esc(x.id)}">
        <div class="cc-head">
          <span class="cc-name">✏️ ${esc(x.title)}</span>
          <span class="cc-badge">${esc(x.type)}</span>
        </div>
        <div class="cc-sub">${esc(catName)} · 难度 <span class="cc-diff">${stars(x.diff)}</span></div>
        <p class="highlight">📝 ${esc(x.body)}</p>
        ${links ? `<div class="cc-fmlinks">💡 涉及公式：${links}</div>` : ''}
        <div class="cc-meta">
          <span>📚 共 ${(x.formulas || []).length} 条搭配公式</span>
          <button class="favbtn ${isFav ? 'on' : ''}" data-type="case" data-id="${esc(x.id)}">${isFav ? '★' : '☆'}</button>
        </div>
        <div class="cc-open"><button data-open="${esc(x.id)}">查看答案与解析 ▸</button></div>
      </article>`;
  }

  /* ---------- 习题答案弹窗 ---------- */
  function openExercise(id) {
    const x = CASES.find((v) => v.id === id);
    if (!x) return;
    const catName = catNameOf(x.course, x.cat) || '';
    const fmls = (x.formulas || []).map((fid) => {
      const f = formulaById(fid);
      return f ? `<div class="m-formula">
        <pre class="fml">${esc(f.formula)}</pre>
        <button class="cc-fmlink" data-goto-formula="${esc(f.id)}">📌 ${esc(f.title)}：去公式速记定位</button>
      </div>` : '';
    }).join('');
    $('#modal-body').innerHTML = `
      <h2>✏️ ${esc(x.title)}</h2>
      <div class="meta">${esc(x.type)} · 难度 ${stars(x.diff)} · ${esc(catName)}</div>
      <div class="m-field"><h4>📝 题目</h4><p>${esc(x.body)}</p></div>
      ${fmls ? `<div class="m-field"><h4>📖 本题用到的公式（已与公式速记联动）</h4>${fmls}</div>` : ''}
      <div class="m-field"><h4>✅ 参考答案</h4><div class="m-note">${esc(x.answer)}</div></div>
      <div class="m-field"><h4>🧭 解题思路</h4><p>${esc(x.step)}</p></div>
      ${x.pitfall ? `<div class="m-field"><h4>⚠️ 易错点</h4><p>${esc(x.pitfall)}</p></div>` : ''}`;
    $('#case-modal').classList.remove('hidden');
  }
  function closeModal() { $('#case-modal').classList.add('hidden'); }

  /* ---------- 公式联动：跳回公式速记并滚动高亮目标公式卡 ---------- */
  function gotoFormula(fid) {
    const f = formulaById(fid);
    if (!f) return;
    closeModal();
    keepQ = false;
    S.formula.q = '';
    S.formula.favOnly = false;
    // 先按公式所在课程路由（routeView 会重置筛选），再切到该公式分类后重绘，保证卡片可见
    goHash('#/course/' + f.course.id);
    S.formula.cat = f.cat.id;
    S.course.tab = 'formula';
    renderCourse();
    setTimeout(() => {
      const card = document.querySelector('#cof-list .formula-card[data-id="' + f.id + '"]');
      if (!card) return;
      try { card.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) { /* 忽略 */ }
      card.classList.add('fml-hl');
      setTimeout(() => card.classList.remove('fml-hl'), 2600);
    }, 80);
  }

  /* ---------- 事件 ---------- */
  // 站内跳转统一入口：显式设 hash（失败也不影响）+ 直接渲染，
  // 不依赖浏览器默认 hash 导航或 hashchange 事件——在任何预览沙盒里都点得动
  function onDocClick(e) {
    const t = e.target;

    // 底部 Tab 栏（小程序外壳）：公式/习题 Tab 指向当前（或第一门）课程
    const tab = t.closest('.mp-tab[data-tab]');
    if (tab) {
      const tb = tab.getAttribute('data-tab');
      const cid = S.course.id || (COURSES[0] && COURSES[0].id) || '';
      goHash(tb === 'home' ? '#/'
        : tb === 'credits' ? '#/credits'
        : tb === 'formula' ? '#/course/' + cid
        : '#/course/' + cid + '/cases');
      return;
    }

    // 顶栏返回键
    if (t.closest('#mp-back')) { goHash('#/'); return; }

    // 站内 hash 链接（封面卡、标签页、返回首页等）：统一 preventDefault + goHash
    const link = t.closest('a[href^="#/"]');
    if (link) {
      if (typeof e.preventDefault === 'function') e.preventDefault();
      goHash(link.getAttribute('href') || '#/');
      return;
    }

    // 收藏按钮
    const fb = t.closest('.favbtn');
    if (fb) { toggleFav(fb.dataset.type, fb.dataset.id); renderCurrent(); return; }

    // 课程页公式分类（chips + 卡内分类标签）
    const st = t.closest('[data-setcat]');
    if (st) { S.formula.cat = st.dataset.setcat; renderCourse(); return; }

    // 「只看收藏」
    const ft = t.closest('#cof-favtoggle');
    if (ft) { S.formula.favOnly = !S.formula.favOnly; renderCourse(); return; }

    // 课程页案例分类 / 场景
    const ca = t.closest('#coc-cates .chip');
    if (ca) { S.cases.cate = ca.dataset.casecate; renderCourse(); return; }
    const sc = t.closest('#coc-scenes .chip');
    if (sc) { S.cases.scene = sc.dataset.casescene; renderCourse(); return; }

    // 习题答案弹窗
    const op = t.closest('[data-open]');
    if (op) { openExercise(op.dataset.open); return; }

    // 公式联动：习题卡/弹窗里的「涉及公式」→ 回公式速记并高亮该公式卡
    const gf = t.closest('[data-goto-formula]');
    if (gf) { gotoFormula(gf.dataset.gotoFormula); return; }

    // 学分页交互（v4.1）
    if (creditOnClick(t)) return;

    // 弹窗关闭
    if (t.closest('#modal-close') || t.id === 'case-modal') closeModal();
  }

  /* ---------- 学分页事件（v4.1） ---------- */
  function creditOnClick(t) {
    // 标记已修满 / 取消
    const cd = t.closest('.cp-done');
    if (cd) {
      toggleCreditDone(cd.dataset.part || (cd.getAttribute && cd.getAttribute('data-part')) || '');
      renderCredits();
      return true;
    }
    // 添加文件（点击后触发隐藏 input）
    const ca = t.closest('.cp-add');
    if (ca) {
      S.credits.pending = ca.dataset.part || (ca.getAttribute && ca.getAttribute('data-part')) || '';
      const fi = $('#cred-file');
      if (fi) { fi.value = ''; try { fi.click(); } catch (e) { /* 忽略 */ } }
      return true;
    }
    // 删除文件
    const df = t.closest('.cf-del');
    if (df) {
      creditStore.del(df.dataset.del || (df.getAttribute && df.getAttribute('data-del')) || '');
      renderCredits();
      return true;
    }
    // 下载文件
    const dlc = t.closest('.cf-dl');
    if (dlc) {
      const fid = dlc.dataset.dl || (dlc.getAttribute && dlc.getAttribute('data-dl')) || '';
      const rec = creditStore.list().find((r) => r.id === fid);
      if (rec) downloadFile(rec);
      return true;
    }
    // 导出 / 导入备份
    if (t.closest('#cred-export')) { exportCreditBackup(); return true; }
    if (t.closest('#cred-import-click')) {
      const ii = $('#cred-import');
      if (ii) { ii.value = ''; try { ii.click(); } catch (e) { /* 忽略 */ } }
      return true;
    }
    return false;
  }
  function renderCurrent() {
    ({ home: renderHome, course: renderCourse, credits: renderCredits })[S.view]();
  }

  /* ---------- 封面 3D 倾斜：整卡朝鼠标方向微微转动（纯 CSS 3D，事件委托） ---------- */
  (function coverTilt() {
    var MAX = 7; // 最大倾斜角（度）
    var cur = null;
    // 系统开启「减弱动态效果」时跳过鼠标倾斜，只保留静态 3D 立体
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    function applyTilt(v, x, y) {
      var r = v.getBoundingClientRect();
      var px = (x - r.left) / r.width - 0.5;   // -0.5（左）.. 0.5（右）
      var py = (y - r.top) / r.height - 0.5;   // -0.5（上）.. 0.5（下）
      var rx = -py * 2 * MAX;                  // 上下倾斜
      var ry = px * 2 * MAX;                   // 左右倾斜
      v.style.transform = 'translateY(-6px) rotateX(' + rx.toFixed(2) + 'deg) rotateY(' + ry.toFixed(2) + 'deg)';
    }
    function resetTilt(v) { v.style.transform = ''; }
    document.addEventListener('pointermove', function (e) {
      var v = e.target && e.target.closest ? e.target.closest('.c3d') : null;
      if (v) {
        if (cur && cur !== v) resetTilt(cur);
        cur = v;
        applyTilt(v, e.clientX, e.clientY);
      } else if (cur) {
        resetTilt(cur);
        cur = null;
      }
    }, { passive: true });
    document.addEventListener('pointerleave', function () {
      if (cur) { resetTilt(cur); cur = null; }
    });
    // 视图切换（回首页重绘）后丢弃旧容器引用，避免残留内联 transform
    document.addEventListener('click', function () {
      if (cur && !cur.isConnected) { cur = null; }
    });
  })();

  /* ---------- 初始化 ---------- */
  // 全局错误提示条：任何脚本报错都在页面底部可见，演示现场能自查'点了没反应'的原因
  window.addEventListener('error', (ev) => {
    try {
      const d = document.createElement('div');
      d.className = 'err-banner';
      d.textContent = '⚠️ 页面出了点问题：' + ((ev.message) || (ev.error && ev.error.message) || '未知错误');
      document.body.appendChild(d);
    } catch (e2) { /* ignore */ }
  });
  // 搜索框用事件委托（输入框在 DOM 中保持不重建，避免丢焦点）
  document.addEventListener('input', (e) => {
    const el = e.target;
    if (!el || !el.id) return;
    if (el.id === 'cof-search') { S.formula.q = el.value; renderCourse(); }
    else if (el.id === 'coc-search') { S.cases.q = el.value; renderCourse(); }
  });
  // 学分页：选择文件 / 导入备份（change 委托）
  document.addEventListener('change', (e) => {
    const el = e.target;
    if (!el || !el.id) return;
    if (el.id === 'cred-file') { handleCreditFiles(el.files, S.credits.pending); }
    else if (el.id === 'cred-import') { importCreditBackup(el.files && el.files[0]); }
  });
  // 学分页：把文件拖到类别卡片上归入该类别（事件委托，重绘后仍有效）
  document.addEventListener('dragover', (e) => {
    const card = e.target && e.target.closest ? e.target.closest('.credit-part') : null;
    if (!card) return;
    e.preventDefault();
    card.classList.add('drop');
  });
  document.addEventListener('dragleave', (e) => {
    const card = e.target && e.target.closest ? e.target.closest('.credit-part') : null;
    if (card) card.classList.remove('drop');
  });
  document.addEventListener('drop', (e) => {
    const card = e.target && e.target.closest ? e.target.closest('.credit-part') : null;
    if (!card || !e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
    e.preventDefault();
    card.classList.remove('drop');
    handleCreditFiles(e.dataTransfer.files, card.getAttribute('data-part') || '');
  });
  document.addEventListener('click', onDocClick);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
  window.addEventListener('hashchange', () => route());
  creditStore.init().then(() => { if (S.view === 'credits') renderCredits(); });
  route();
})();
</script>
</body>
</html>
