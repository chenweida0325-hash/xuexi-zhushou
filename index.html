<style>
/* ============ 学习助手 · 基础样式（v3.11：全站深色——课程页与首页同款黑色机械风，首页白卡 3D 封面保留） ============ */
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  /* v3.11 全站暗色板（与首页 #0a1120 系列同族） */
  --bg: #0b1220;
  --card: #0f1b2e;
  --ink: #e2e8f0;
  --muted: #94a3b8;
  --line: rgba(148, 163, 184, .16);
  --primary: #2563eb;
  --primary-soft: rgba(59, 130, 246, .22);
  --accent: #f59e0b;
  --ok: #16a34a;
  --bad: #dc2626;
  --link: #60a5fa;
  --radius: 14px;
  --shadow: 0 1px 3px rgba(2, 6, 16, .45), 0 6px 18px rgba(2, 6, 16, .35);
}
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.6;
  min-height: 100vh;
}

/* ---------- 小程序外壳：顶部导航条（返回 + 居中标题 + 右侧胶囊装饰，v3.15） ---------- */
.mp-bar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; justify-content: space-between;
  height: 48px; padding: 0 10px;
  background: rgba(9, 15, 27, .78);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(148, 163, 184, .16);
}
.mp-title {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  font-size: 16px; font-weight: 700; letter-spacing: 1px; color: #e2e8f0;
  white-space: nowrap; max-width: 52vw; overflow: hidden; text-overflow: ellipsis;
}
.mp-back {
  border: 1.5px solid rgba(148, 163, 184, .3); background: rgba(148, 163, 184, .06);
  color: #cbd5e1; font-size: 13px; padding: 4px 12px; border-radius: 999px; cursor: pointer;
  transition: all .15s;
}
.mp-back:hover { border-color: var(--link); color: var(--link); }
.mp-capsule { display: flex; gap: 5px; }
.mp-capsule i {
  width: 26px; height: 15px; border-radius: 6px;
  border: 1.5px solid rgba(148, 163, 184, .4); background: rgba(148, 163, 184, .08);
}

/* ---------- 布局 ---------- */
main { max-width: 1040px; margin: 0 auto; padding: 16px 14px 96px; }
.view { display: none; }
.view.active { display: block; animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }
.hidden { display: none !important; }
.loading { color: var(--muted); text-align: center; padding: 40px 0; }

/* ---------- 小程序外壳：底部 Tab 栏（v3.15） ---------- */
.mp-tabbar {
  position: fixed; left: 50%; bottom: 0; transform: translateX(-50%);
  width: 100%; max-width: 1040px; z-index: 30;
  display: flex;
  background: rgba(9, 15, 27, .92);
  backdrop-filter: blur(12px);
  border-top: 1px solid rgba(148, 163, 184, .16);
  box-shadow: 0 -6px 18px rgba(2, 6, 16, .35);
}
.mp-tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 1px; padding: 7px 0 8px; text-decoration: none; color: #7c8ba1;
  font-size: 10.5px; letter-spacing: .5px; user-select: none; text-align: center;
}
.mp-tab .ico { font-size: 17px; line-height: 1.2; }
.mp-tab.active { color: #60a5fa; }
.mp-tab.active::after {
  content: ''; width: 15px; height: 3px; border-radius: 2px; margin-top: 3px;
  background: linear-gradient(90deg, #2563eb, #0d9488);
}
.site-foot { padding-bottom: 96px; }

/* ---------- 课程页背景：与首页同一蓝图网格（更淡），内容层盖在网格之上 ---------- */
#view-course { position: relative; }
#view-course::before {
  content: ''; position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(148, 163, 184, .05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(148, 163, 184, .05) 1px, transparent 1px),
    linear-gradient(rgba(148, 163, 184, .08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(148, 163, 184, .08) 1px, transparent 1px);
  background-size: 44px 44px, 44px 44px, 220px 220px, 220px 220px;
  -webkit-mask-image: radial-gradient(ellipse at 50% 20%, #000 30%, transparent 85%);
  mask-image: radial-gradient(ellipse at 50% 20%, #000 30%, transparent 85%);
}
#view-course > * { position: relative; z-index: 1; }

/* ---------- 工具栏 / 筛选 ---------- */
.toolbar { display: flex; gap: 8px; margin: 8px 0 10px; flex-wrap: wrap; }
.search {
  flex: 1 1 220px; min-width: 0; font-size: 14px;
  padding: 9px 14px; border: 1.5px solid rgba(148, 163, 184, .22); border-radius: 999px;
  outline: none; background: #0d1830; color: var(--ink); transition: border .15s;
}
.search::placeholder { color: rgba(148, 163, 184, .5); }
.search:focus { border-color: var(--link); }
.btn {
  border: 1.5px solid var(--line); background: #0d1830; color: var(--ink);
  padding: 7px 14px; border-radius: 999px; font-size: 13px; cursor: pointer;
  transition: all .15s;
}
.btn:hover { border-color: var(--link); color: var(--link); }
.btn.small { padding: 6px 12px; }
.btn.on { background: var(--primary); border-color: var(--primary); color: #fff; }

/* v5.1 工具栏瘦身：搜索占满首行，右侧只留「⭐ 收藏」与「⋯」两个图标位 */
.toolbar { align-items: center; }
.toolbar .search { flex: 1 1 auto; }
.icon-btn {
  flex: 0 0 auto; width: 38px; height: 34px; padding: 0; font-size: 16px; line-height: 1;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1.5px solid var(--line); background: #0d1830; color: var(--ink);
  border-radius: 999px; cursor: pointer; transition: all .15s;
}
.icon-btn:hover { border-color: var(--link); color: var(--link); }
.more-menu { position: relative; flex: 0 0 auto; }
.more-pop {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 40;
  min-width: 172px; padding: 6px; display: flex; flex-direction: column; gap: 2px;
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 14px 34px rgba(0, 0, 0, .5);
}
.more-pop.hidden { display: none; }
.more-pop button {
  border: 0; background: none; color: var(--ink); text-align: left;
  padding: 9px 12px; border-radius: 8px; font-size: 13px; cursor: pointer;
}
.more-pop button:hover { background: rgba(96, 165, 250, .14); color: var(--link); }

/* v5.1 分类 chips：单行横向滑动，不再折成 7 行把公式挤出首屏
   （用 .chips.chips-scroll 提高优先级，压过后面的 .chips{flex-wrap:wrap}） */
.chips.chips-scroll {
  flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden;
  scrollbar-width: none; -webkit-overflow-scrolling: touch;
  padding-bottom: 2px;
  /* 右侧渐隐，暗示「还能往右滑」 */
  -webkit-mask-image: linear-gradient(to right, #000 0, #000 calc(100% - 26px), transparent 100%);
  mask-image: linear-gradient(to right, #000 0, #000 calc(100% - 26px), transparent 100%);
}
.chips.chips-scroll::-webkit-scrollbar { display: none; }
.chips.chips-scroll .chip { flex: 0 0 auto; white-space: nowrap; }

/* ---------- v5.2 折叠目录（课程页公式分类导航） ---------- */
.cat-dir { display: flex; flex-direction: column; gap: 8px; margin-top: 2px; }
.dir-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  font-size: 12px; color: var(--muted); padding: 0 2px 2px;
}
.dir-bar .chip { cursor: pointer; }
.dir-row {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 11px 14px; border: 1px solid var(--line); border-radius: 12px;
  background: #0d1830; cursor: pointer; transition: border-color .15s, background .15s;
}
.dir-row:hover { border-color: var(--link); }
.dir-row.open { border-color: rgba(96, 165, 250, .55); background: rgba(96, 165, 250, .08); }
.dir-emoji { font-size: 16px; flex: 0 0 auto; }
.dir-name { font-size: 14px; font-weight: 600; color: var(--ink); flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dir-meta { font-size: 11.5px; color: var(--muted); flex: 0 0 auto; }
.dir-caret { font-size: 12px; color: var(--muted); flex: 0 0 auto; transition: transform .15s, color .15s; }
.dir-row.open .dir-caret { transform: rotate(180deg); color: var(--link); }
/* v5.3 目录行收藏星（不影响展开） */
.dir-star {
  flex: 0 0 auto; font-size: 14px; line-height: 1; color: rgba(148, 163, 184, .55);
  padding: 2px 2px 2px 6px; cursor: pointer; transition: color .15s, transform .12s;
}
.dir-star:hover { color: #fbbf24; transform: scale(1.15); }
.dir-star.on { color: #fbbf24; }
.dir-body { margin: 0 0 4px; }
.dir-body .cat-intro { margin-top: 0; }

/* ---------- v5.3 滚动收起课程头 ---------- */
#course-head.compact .co-banner { display: none; }
#course-head.compact .co-sub { display: none; }
#course-head.compact .co-head-in { padding: 8px 16px 9px; }
#course-head.compact .co-title { font-size: 15px; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 14px; }
.chips .chip {
  border: 1.5px solid var(--line); background: #0d1830; color: #b6c2d4;
  font-size: 13px; padding: 5px 13px; border-radius: 999px; cursor: pointer;
  transition: all .15s;
}
.chips .chip:hover { border-color: var(--link); color: var(--link); }
.chips .chip.on { background: var(--primary-soft); border-color: rgba(96, 165, 250, .55); color: #93c5fd; font-weight: 600; }
.chips.small-chips .chip { font-size: 12px; padding: 4px 11px; }

/* ---------- 首页：四张封面（2×2 大卡片 + 黑色机械风装饰背景） ---------- */
#view-home {
  position: relative;
  min-height: calc(100vh - 128px);
  /* 居中列布局只在激活态生效：ID 级 display 会压过 .view{display:none}，
     若写在这里，点封面进课程后首页（报头+封面）仍会叠在课程内容上方，必须往下滚才能看到公式/习题 */
  flex-direction: column; align-items: center; justify-content: center;
  padding: 6px 0 40px;
  background:
    radial-gradient(900px 520px at 15% 6%, rgba(59, 130, 246, .16), transparent 62%),
    radial-gradient(820px 480px at 86% 8%, rgba(139, 92, 246, .15), transparent 62%),
    radial-gradient(1000px 560px at 82% 96%, rgba(217, 119, 6, .13), transparent 62%),
    radial-gradient(760px 440px at 14% 94%, rgba(45, 212, 191, .13), transparent 62%),
    linear-gradient(180deg, #0a1120 0%, #0d1524 56%, #0a101e 100%);
}
#view-home.active { display: flex; } /* 仅首页路由激活时启用 flex 布局 */
.home-bg { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
/* 蓝图网格：44px 细格 + 220px 粗格，中心清晰、四周渐隐 */
.home-bg::before {
  content: ''; position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(148, 163, 184, .075) 1px, transparent 1px),
    linear-gradient(90deg, rgba(148, 163, 184, .075) 1px, transparent 1px),
    linear-gradient(rgba(148, 163, 184, .12) 1px, transparent 1px),
    linear-gradient(90deg, rgba(148, 163, 184, .12) 1px, transparent 1px);
  background-size: 44px 44px, 44px 44px, 220px 220px, 220px 220px;
  -webkit-mask-image: radial-gradient(ellipse at 50% 38%, #000 28%, transparent 82%);
  mask-image: radial-gradient(ellipse at 50% 38%, #000 28%, transparent 82%);
}
/* 暗角：把四周压暗，让中部封面「浮」出来 */
.home-bg::after {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(130% 95% at 50% 35%, transparent 52%, rgba(2, 6, 16, .5) 100%);
}
/* v4.2：背景水印线稿已移除，仅保留蓝图网格（::before）与暗角（::after） */
@media (prefers-reduced-motion: reduce) {
  .c3d, .cover-card, .cover-card .cc-shine, .cover-card img.cc-cover,
  .cc-plates, .cc-plates::before, .cc-plates::after { transition: none; }
}

/* v3.11：全站统一暗色——原首页专用的 :has 暗色规则已合并进顶栏/页脚/组件基座样式 */

/* 首页报头（深色版） */
.home-hero {
  position: relative; z-index: 1; text-align: center; margin: 0 0 26px;
  border-radius: 999px; padding: 10px 26px 14px;
  background: radial-gradient(500px 130px at 50% 58%, rgba(30, 64, 175, .34), transparent 72%);
}
.hh-title {
  font-size: 36px; font-weight: 800; letter-spacing: 2px; line-height: 1.2;
  color: #e2e8f0;
}
.hh-title .hh-logo { margin-right: 4px; }
.home-qr {
  position: relative; z-index: 1; display: flex; align-items: center; justify-content: center;
  gap: 10px; margin: -4px 0 20px;
}
.home-qr img { width: 64px; height: 64px; border-radius: 12px; background: #fff; padding: 6px; box-shadow: 0 8px 22px rgba(2, 6, 16, .45); }
.home-qr span { font-size: 12.5px; color: var(--muted); letter-spacing: .5px; }
@supports ((background-clip: text) or (-webkit-background-clip: text)) {
  .hh-title {
    background: linear-gradient(92deg, #60a5fa 10%, #2dd4bf 52%, #fbbf24 94%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  .hh-title .hh-logo { -webkit-text-fill-color: transparent; }
}
.home-hero::after {
  content: ''; display: block; width: 72px; height: 3px; margin: 14px auto 0;
  border-radius: 2px; background: linear-gradient(90deg, #60a5fa, #2dd4bf, #fbbf24);
  box-shadow: 0 0 12px rgba(56, 189, 248, .55);
}

/* ---------- 首页全局搜索框（v4.6） ---------- */
.home-search {
  position: relative; z-index: 1; max-width: 460px; margin: -2px auto 16px;
}
.home-search .search {
  width: 100%; background: rgba(13, 24, 48, .85); border-color: rgba(148, 163, 184, .28);
  padding: 10px 18px; font-size: 14.5px;
}

/* ---------- 全站搜索结果（v4.6） ---------- */
.gs-group { margin-top: 20px; }
.gs-group:first-child { margin-top: 4px; }
.gs-head { font-size: 14.5px; font-weight: 700; color: var(--link); margin-bottom: 10px; }
.gs-note { font-size: 12.5px; color: var(--muted); }
.gs-item {
  display: block; text-decoration: none; color: inherit;
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 15px; margin-bottom: 10px; transition: border-color .15s, transform .12s;
}
.gs-item:hover { border-color: var(--link); transform: translateY(-1px); }
.gs-item b { font-size: 14.5px; }
.gs-item .gs-meta { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
.gs-item .gs-preview { font-size: 12.5px; color: var(--muted); margin-top: 5px; line-height: 1.6; }

/* ---------- 翻卡记忆（v4.6） ---------- */
.flash-wrap { max-width: 520px; margin: 6px auto 0; text-align: center; }
.flash-progress { font-size: 12.5px; color: var(--muted); margin-bottom: 10px; }
.flash-card {
  position: relative; height: 250px; cursor: pointer; perspective: 1000px; margin-bottom: 14px;
}
.flash-face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px;
  box-shadow: var(--shadow);
}
.flash-front { transform: rotateY(0deg); }
.flash-back { transform: rotateY(180deg); background: #0d1830; border-color: rgba(96, 165, 250, .4); }
.flash-card.flipped .flash-front { transform: rotateY(-180deg); }
.flash-card.flipped .flash-back { transform: rotateY(0deg); }
.flash-q { font-size: 15px; color: var(--muted); }
.flash-q b { display: block; font-size: 21px; color: var(--ink); margin-top: 6px; }
.flash-hint { font-size: 12.5px; color: rgba(148, 163, 184, .45); }
.flash-back .fml { width: 100%; text-align: left; margin: 0; }
.flash-back .flash-tip { font-size: 12.5px; color: #fbbf24; margin-top: 2px; }
.flash-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.flash-actions .btn { min-width: 96px; font-size: 13.5px; padding: 8px 14px; }
.flash-done { color: var(--muted); font-size: 14px; padding: 30px 0; }

/* v4.7 讲练翻卡：一个公式配一道例题 */
.pair-links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.pair-links .cc-fmlink { padding: 5px 12px; font-size: 12px; }
.flash-back .pair-case { width: 100%; text-align: left; border-top: 1px dashed rgba(96, 165, 250, .25); padding-top: 8px; }
.flash-card .flash-face.flash-back { overflow-y: auto; justify-content: flex-start; }
.pair-body { font-size: 12.5px; color: var(--ink); line-height: 1.7; margin-top: 2px; }
.pair-ans { font-size: 12.5px; color: var(--ok); line-height: 1.6; margin-top: 6px; white-space: pre-wrap; }
.pair-step { font-size: 12px; color: var(--muted); line-height: 1.6; margin-top: 6px; }
.pair-pit { font-size: 12px; color: #fbbf24; line-height: 1.6; margin-top: 6px; }
.pair-more { font-size: 12px; color: var(--muted); margin-top: 8px; }

/* v4.8 课表：我的课表（2026-2027 第 1 学期） */
.sc-head { padding: 4px 2px 14px; }
.sc-title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sc-emoji { font-size: 26px; }
.sc-title { font-size: 24px; font-weight: 700; color: var(--ink); }
.sc-nav { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.sc-nav .btn { padding: 6px 14px; font-size: 13px; }
.sc-week { font-size: 13.5px; font-weight: 600; color: var(--ink); background: #0d1830; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; }
/* v4.9 课表：按天分组的彩色课程卡片流（深色主题，实验课简单行不排版） */
.sc-day { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; margin-top: 14px; }
.sc-day.sc-today { border-color: rgba(96, 165, 250, .55); box-shadow: 0 0 0 1px rgba(96, 165, 250, .25), 0 8px 26px rgba(96, 165, 250, .10); }
.sc-day-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
.sc-day-name { font-size: 15.5px; font-weight: 700; color: var(--ink); }
.sc-day-date { font-size: 12.5px; color: var(--muted); }
.sc-day-badge { font-size: 11.5px; font-weight: 700; color: #08101f; background: linear-gradient(135deg, #60a5fa, #38bdf8); border-radius: 999px; padding: 2px 10px; }
.sc-day-count { margin-left: auto; font-size: 12px; color: var(--muted); }

.home-grid {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px;
  width: 100%; align-items: stretch;
  position: relative; z-index: 1;
  /* 3D 透视起点：整张封面（含厚度层）在 hover 时朝鼠标方向微微倾斜 */
  perspective: 1100px;
}
/* 3D 封面容器：网格单元。卡片 + 外部厚度层包在一起，倾斜时整体转动；
   position:relative 且 z-index:auto → 不构成层叠上下文，
   厚度层（z-index:-1）才会在网格层叠上下文里排在卡片白底之下 */
.c3d { position: relative; }
.c3d > .cover-card { height: 100%; }
.cover-card {
  position: relative; display: flex; flex-direction: column; text-decoration: none; color: inherit;
  background: var(--card); border: 1px solid var(--line); border-radius: 20px;
  box-shadow: 0 4px 8px -3px rgba(15, 23, 42, .14), 0 22px 40px -14px rgba(15, 23, 42, .22);
  border-top: 4px solid var(--cc, var(--primary));
  transition: box-shadow .22s, border-color .22s;
  will-change: transform;
}
/* 3D 厚度：两层同色系「侧板」错位叠在卡片背后（向右/下伸出）。
   必须是卡片的兄弟（不能作卡片子元素）：z-index:-1 只排在兄弟之下，
   若作子元素会盖在不透明的卡片白底之上。用 2D translate 而非 translateZ：
   网格透视会把远离消失点一侧的 Z 向侧板投影缩进卡片背后，靠右/靠下的
   卡片静止时会看不出厚度；2D 叠层四张卡都稳定可见 */
.cc-plates { position: absolute; inset: 0; z-index: -1; border-radius: 20px; }
.cc-plates::before, .cc-plates::after {
  content: ''; position: absolute; inset: 0; border-radius: inherit;
}
.cc-plates::before { /* 第一层厚度（浅） */
  background: var(--cc-plate, var(--cc));
  border-radius: 5px; /* 圆角必须远小于外露量：20px 圆角会把 6-12px 的厚度条整个裁掉 */
  transform: translate(7px, 9px);
}
.cc-plates::after {  /* 第二层厚度（深）+ 落地投影 */
  background: var(--cc-deep, var(--cc));
  border-radius: 10px;
  transform: translate(14px, 18px);
  box-shadow: 0 18px 34px -10px rgba(15, 23, 42, .38);
}
.c3d:hover { transform: translateY(-6px); } /* JS 倾斜接管时会被内联 transform 覆盖；无 JS 时保留上浮 */
.cover-card:hover {
  border-color: transparent;
  box-shadow: 0 12px 22px -8px rgba(15, 23, 42, .16), 0 30px 52px -16px var(--cc, var(--primary));
}
.c3d:hover .cc-plates::after { box-shadow: 0 26px 40px -12px rgba(15, 23, 42, .45); }
.cover-card img.cc-cover {
  display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover;
  object-position: center; border-bottom: 1px solid var(--line);
  /* overflow:hidden 移除后，顶角圆角改由图片自己带 */
  border-radius: 19px 19px 0 0;
  /* 封面图「悬浮在卡面之前」：自带 3D 投影放大一点点 + 投影，不需父级 preserve-3d */
  transform: perspective(900px) translateZ(16px);
  filter: drop-shadow(0 10px 12px rgba(15, 23, 42, .20));
  transition: filter .2s;
}
.cover-card:hover img.cc-cover {
  filter: brightness(1.05) saturate(1.08) drop-shadow(0 14px 18px rgba(15, 23, 42, .22));
}
/* 镜面高光：hover 时从封面右下方扫过一道光 */
.cc-shine {
  position: absolute; inset: 0; z-index: 3; pointer-events: none;
  border-radius: 20px;
  background: linear-gradient(115deg, transparent 32%, rgba(255, 255, 255, .5) 50%, transparent 68%);
  opacity: 0; transition: opacity .25s;
}
.cover-card:hover .cc-shine, .cover-card:focus-visible .cc-shine { opacity: 1; }
.cover-card:focus-visible { outline: 2px solid var(--cc, var(--primary)); outline-offset: 3px; }
.cc-body { padding: 14px 18px 16px; display: flex; flex-direction: column; gap: 7px; flex: 1; }

  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}

.cover-card:hover .cc-name .cc-go { transform: translateX(4px); color: var(--cc, var(--primary)); }
/* v4.2：cc-desc（课程简介）与首页卡片计数行 cc-meta 已移除 */
/* 全站暗色后回钉首页封面为白卡（深底白卡保持既有对比，
   也保证 3D 厚度层 z-index:-1 排序与 plate3D 断言稳定） */

    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result);
        const files = Array.isArray(data && data.files) ? data.files : [];
        const recs = [];
        files.forEach((f) => {
          const blob = dataURLToBlob(f.data);
          if (!blob) return;
          recs.push({
            id: (f.id && String(f.id)) || creditUid(),
            partId: f.partId || '',
            name: f.name || '未命名文件',
            type: f.type || blob.type || 'application/octet-stream',
            size: f.size || blob.size,
            time: f.time || Date.now(),
            data: blob
          });
        });
        if (recs.length) {
          creditStore.replaceAll(recs);
          if (data && data.parts && typeof data.parts === 'object') {
            creditDone = {};
            Object.keys(data.parts).forEach((k) => { if (data.parts[k]) creditDone[k] = 1; });
            saveCreditDone();
          }
        }
        renderCredits();
      } catch (e) { setCreditWarn('导入失败：备份文件格式不正确'); renderCredits(); }
    };
    r.onerror = () => { setCreditWarn('导入失败：无法读取文件'); renderCredits(); };
    r.readAsText(file);
  }

  /* ---------- 学分页渲染（v4.1） ---------- */
  function creditParts() { return (CREDITS && CREDITS.parts) || []; }
  function creditProgress() {
    const parts = creditParts();
    let got = 0, doneReq = 0, doneElect = 0;
    parts.forEach((p) => {
      if (!creditDone[p.id]) return;
      if (p.type === 'required') { got += (p.credit || 0.5); doneReq += 1; }
      else doneElect += 1;
    });
    if (doneElect >= 2) got += 1; // 四选二：勾满任意 2 类共 1 学分
    return { got: Math.round(got * 100) / 100, doneReq, doneElect };
  }
  function partCardHTML(p, files) {
    const done = !!creditDone[p.id];
    const badge = p.type === 'required' ? '必修 · ' + p.credit + ' 学分' : '四选二 · ' + p.credit + ' 学分';
    const frows = files.length ? files.map((f) => `
        <div class="cp-file">
          <span class="cf-ic">${fileIcon(f.type)}</span>
          <div class="cf-info"><b>${esc(f.name)}</b><i>${fmtSize(f.size)} · ${fmtTime(f.time)}</i></div>
          <button class="cf-dl" data-dl="${esc(f.id)}">下载</button>
          <button class="cf-del" data-del="${esc(f.id)}">删除</button>
        </div>`).join('')
      : '<p class="cp-empty">暂无文件，点「＋ 添加文件」或直接把文件拖到卡片上</p>';
    return `
      <div class="credit-part card${done ? ' done' : ''}" data-part="${esc(p.id)}">
        <div class="cp-head">
          <span class="cp-name">${p.emoji} ${esc(p.name)}</span>
          <span class="chip">${esc(badge)}</span>
          <button class="cp-done${done ? ' on' : ''}" data-part="${esc(p.id)}">${done ? '✔ 已修满' : '○ 标记已修满'}</button>
        </div>
        ${p.desc ? `<p class="cp-desc">${esc(p.desc)}</p>` : ''}
        <div class="cp-files">${frows}</div>
        <div class="cp-actions">
          <button class="cp-add btn small" data-part="${esc(p.id)}">＋ 添加文件</button>
          <span class="cp-dragtip">⇩ 支持拖拽到卡片</span>
        </div>
      </div>`;
  }
  function renderCredits() {
    const C = CREDITS || { title: '第二课堂学分', total: 2.5, targetNote: '' };
    const parts = creditParts();
    const pg = creditProgress();
    const total = C.total || 2.5;
    const pct = total > 0 ? Math.round((pg.got / total) * 100) : 0;
    const remain = Math.max(0, Math.round((total - pg.got) * 100) / 100);
    const required = parts.filter((p) => p.type === 'required');

    const blocks = [];

      <div class="cred-block">

      </div>`);
    if (elect.length) blocks.push(`
      <div class="cred-block">
        <div class="cred-block-head"><b>✅ 四选二（1 学分）</b><span>任选 2 类修满即可，各 0.5 学分</span></div>
        <div class="cred-parts">${elect.map((p) => partCardHTML(p, creditStore.list(p.id))).join('')}</div>
      </div>`);
    const warns = [];
    if (creditWarnMsg) warns.push(creditWarnMsg);
    if (creditStore.broken()) warns.push('当前环境不支持持久保存（如单文件离线 / 隐私模式），文件仅本次打开有效，建议使用在线版');
    $('#cred-list').innerHTML = `
      <div class="cred-head">
        <div class="cred-title-row">
          <span class="cred-emoji">🎖️</span>

          ${C.target ? `<span class="chip on">${esc(C.targetNote || C.target)}</span>` : ''}
        </div>
        ${C.rule ? `<p class="cred-rule">📜 ${esc(C.rule)}</p>` : ''}
        <div class="cred-progress">
          <div class="cred-bar"><i style="width:${pct}%"></i></div>
          <div class="cred-nums"><b>${fmtNum(pg.got)} / ${fmtNum(total)} 学分</b><i>已获 ${pct}% · 还差 ${fmtNum(remain)}</i></div>
        </div>
        <div class="cred-meter">
          <span class="chip">必修已勾 ${pg.doneReq}/3</span>
          <span class="chip">四选二已勾 ${pg.doneElect}/4（勾满任意 2 类＝1 学分）</span>
        </div>
      </div>
      ${blocks.join('')}
      <div class="cred-tools">
        <button id="cred-export" class="btn">📤 导出备份</button>
        <button id="cred-import-click" class="btn">📥 导入备份（覆盖）</button>
        <p class="cred-hint">💾 文件只保存在本机浏览器，他人访问看不到你的文件；换设备请「导出备份 → 新设备导入」。</p>
        ${warns.length ? `<p class="cred-warn">⚠️ ${warns.map(esc).join('；')}</p>` : ''}
      </div>`;
  }

  /* ---------- 状态 ---------- */
  const S = {
    view: 'home',
    course: { id: null, tab: 'formula' },
    formula: { cat: 'all', q: '', favOnly: false, openCat: null, openAll: false },
    cases: { cate: '全部', scene: '全部', q: '', openCat: null, openAll: false },
    credits: { pending: null },
    search: { q: '' }, // v4.6 全站搜索
    flash: { active: false, list: [], idx: 0, known: 0 }, // v4.6 翻卡记忆
    pair: { active: false, list: [], idx: 0, known: 0 }, // v4.7 讲练翻卡：一公式配一例题
    schedule: { week: 0 } // v4.8 课表：0=跟随当前周
  };
  let keepQ = false; // 案例弹窗「知识点跳转」：切到目标课程时保留搜索词

  /* ---------- 数据辅助 ---------- */
  // 拍平：课程 → 分类 → 公式，每条带 cat/course 引用
  function allFormulas() {
    const out = [];
    COURSES.forEach((c) => (c.categories || []).forEach((cat) => (cat.formulas || []).forEach((f) => {
      out.push(Object.assign({}, f, { cat: cat, course: c }));
    })));
    return out;
  }
  function formulaHaystack(f) {
    return [f.title, f.formula, f.params, f.tip, f.mnemonic, f.cat.name, f.course.name].join(' ').toLowerCase();
  }
  function courseById(id) { return COURSES.find((c) => c.id === id); }
  function catCount(c) { return (c.categories || []).length; }
  function formulaCount(c) { return (c.categories || []).reduce((n, cat) => n + (cat.formulas || []).length, 0); }
  function casesOf(courseId) { return CASES.filter((c) => c.course === courseId); }
  // v3.12 习题·公式联动辅助
  function formulaById(id) { return allFormulas().find((f) => f.id === id) || null; }
  function catNameOf(courseId, catId) {
    const c = courseById(courseId);
    const cat = c && (c.categories || []).find((x) => x.id === catId);
    return cat ? cat.name : '';
  }
  // v4.7 讲练配对：一个公式 → 引用它的本课习题列表
  function casesForFormula(fid) {
    const f = formulaById(fid);
    if (!f) return [];
    return casesOf(f.course.id).filter((x) => (x.formulas || []).indexOf(fid) >= 0);
  }
  /* ---------- v4.8 课表辅助 ---------- */
  const SCHEDULE = window.KC_SCHEDULE || null;
  // v4.9：每门课固定高饱和色（深色主题下的彩色课程卡片）
  const COURSE_COLORS = {
    '机械设计': '#60a5fa',
    '电工电子学Ⅱ': '#a78bfa',
    '液压与气压传动': '#2dd4bf',
    '机械制造装备': '#fbbf24',
    '就业指导': '#f472b6',
    '机械创新设计': '#34d399',
    '机械装备智能运维基础': '#fb923c'
  };
  function courseColor(name) { return COURSE_COLORS[name] || '#94a3b8'; }
  function scheduleWeekStart() { return SCHEDULE ? SCHEDULE.weekStart : '2026-09-07'; }
  // 当前周（1 起）：今天 - 第 1 周周一 的整天数 ÷ 7 + 1，越界钳制到 [1, weeks]
  function currentWeek() {
    const ws = scheduleWeekStart();
    const base = new Date(ws + 'T00:00:00');
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const diff = Math.floor((today - base) / 86400000);
    const w = Math.floor(diff / 7) + 1;
    const weeks = (SCHEDULE && SCHEDULE.weeks) || 18;
    return Math.max(1, Math.min(weeks, w));
  }
  // 第 week 周的周一~周日（格式 MM-DD）区间文案
  function weekDateRange(week) {
    const ws = scheduleWeekStart();
    const base = new Date(ws + 'T00:00:00');
    const mon = new Date(base.getTime() + (week - 1) * 7 * 86400000);
    const sun = new Date(mon.getTime() + 6 * 86400000);
    const fmt = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    return fmt(mon) + ' ~ ' + fmt(sun);
  }
  // 今天星期几（1-7，周一=1）：getDay() 0=周日 → 周日归 7
  function todayDay() { const d = new Date().getDay(); return d === 0 ? 7 : d; }
  // 当前时间在第几节（跨节次 1-11），不在上课时间返回 0；按校区作息判断
  function currentPeriodIndex(campus) {
    const times = (SCHEDULE && SCHEDULE.times) || {};
    const tb = times[campus || '墨轩湖校区'] || (times['墨轩湖校区'] || []);
    const now = new Date();
    const hm = now.getHours() * 60 + now.getMinutes();
    let cur = 0;
    tb.forEach((t) => {
      const [sh, sm] = String(t.start).split(':').map(Number);
      const [eh, em] = String(t.end).split(':').map(Number);
      const s0 = sh * 60 + sm, e0 = eh * 60 + em;
      if (hm >= s0 && hm <= e0) cur = t.s;
    });
    return cur;
  }
  // 解析周次表达式，判断第 week 周是否有课
  // 支持：1-3周(单),7-15周(单) / 1-3周,6-9周,11-12周 / 第5周 / 2周,6-14周(双) / 13-16周
  function weekActive(expr, week) {
    if (!expr) return false;
    const parts = String(expr).split(',');
    return parts.some((p) => {
      const m = p.match(/(\d+)(?:\s*-\s*(\d+))?\s*周?\s*(?:[（(]([单双])[)）])?/);
      if (!m) return false;
      const a = parseInt(m[1], 10);
      const b = m[2] ? parseInt(m[2], 10) : a;
      if (week < a || week > b) return false;
      const parity = m[3];
      if (parity === '单') return week % 2 === 1;
      if (parity === '双') return week % 2 === 0;
      return true;
    });
  }
  function stars(n) { n = Math.max(1, Math.min(3, n || 1)); return '★'.repeat(n) + '☆'.repeat(3 - n); }

  /* ---------- 路由 ---------- */
  function goHash(h) {
    h = h || location.hash || '#/';
    try { if (location.hash !== h) location.hash = h; } catch (err) { /* 个别环境禁止改 hash */ }
    route(h);
  }
  function route(forceHash) {
    // forceHash 只接受字符串；hashchange 事件回调不能把 Event 对象传进来
    let h = (typeof forceHash === 'string' && forceHash) || location.hash || '';
    const seg = h.replace(/^#\/?/, '').split('/').filter(Boolean);
    if (seg[0] === 'course') {
      const c = courseById(seg[1]);
      if (c) { routeView('course', c, seg[2] === 'cases' ? 'cases' : 'formula'); return; }
    }
    if (seg[0] === 'credits') { routeView('credits'); return; }
    // v4.8 课表
    if (seg[0] === 'schedule') { routeView('schedule'); return; }
    // v4.6 全站搜索：/#/search?q=xxx（带查询串时 seg[0] 为 search?q=xxx）
    if (seg[0] && (seg[0] === 'search' || seg[0].indexOf('search?') === 0)) {
      const m = h.match(/[?&]q=([^&]*)/);
      S.search.q = m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
      routeView('search');
      return;
    }
    // 无 hash / 未知路由一律回首页（四张封面）
    routeView('home');
  }
  function routeView(v, course, tab) {
    if (v === 'course' && course) {
      if (!S.course.id || S.course.id !== course.id) {
        // 切换课程：清掉跨课筛选（防止旧筛选把新课程筛空）；知识点跳转时保留搜索词
        S.course.id = course.id;
        S.formula.cat = 'all';
        S.formula.favOnly = false;
        S.cases.cate = '全部';
        S.cases.scene = '全部';
        if (!keepQ) S.formula.q = '';
      }
      S.course.tab = tab;
    }
    keepQ = false;
    S.view = v;
    $$('.view').forEach((s) => s.classList.toggle('active', s.id === 'view-' + v));
    // 小程序外壳：标题 / 返回键 / 底部 Tab 高亮
    $('#mp-title').textContent = v === 'course' && course ? course.name
      : v === 'credits' ? '第二课堂学分'
      : v === 'search' ? '全站搜索'
      : v === 'schedule' ? '我的课表' : '学习助手';
    $('#mp-back').classList.toggle('hidden', v === 'home');
    const tabName = v === 'course' ? 'course' : (v === 'credits' ? 'credits' : (v === 'schedule' ? 'schedule' : 'home'));
    $$('#mp-tabbar .mp-tab').forEach((a) => a.classList.toggle('active', a.getAttribute('data-tab') === tabName));
    ({ home: renderHome, course: renderCourse, credits: renderCredits, search: renderSearch, schedule: renderSchedule })[v]();
    window.scrollTo({ top: 0 });
  }

  /* ---------- 首页：只有四张封面 ---------- */
  function renderHome() {

  /* ---------- 全站搜索（v4.6：跨 4 门课搜公式 / 习题） ---------- */
  function renderSearch() {
    const q = (S.search.q || '').trim().toLowerCase();
    const wrap = $('#gs-list');
    if (!q) {
      wrap.innerHTML = '<p class="gs-note">在顶部输入关键词，跨四门课搜索公式与习题（如：螺栓、虚短、节流、定位误差）。</p>';

      x.title, x.body, x.answer, x.type, catNameOf(x.course, x.cat), courseById(x.course) && courseById(x.course).name

  }

  /* ---------- 课表（v4.8/v4.9：按天分组的彩色课程卡片流） ---------- */
  function renderSchedule() {
    if (!SCHEDULE) { $('#sc-grid').innerHTML = '<p class="loading">暂无课表数据</p>'; return; }
    // 当前周：S.schedule.week=0 时跟随今天
    if (!S.schedule.week) S.schedule.week = currentWeek();
    const week = S.schedule.week;
    const weeks = SCHEDULE.weeks || 18;
    const days = ['', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六', '星期日'];
    const today = todayDay();

    // 头部：学期 / 周次导航（姓名班级行按用户要求已移除，v4.9.1）
    $('#sc-term').textContent = SCHEDULE.term || '';
    $('#sc-week').textContent = `第 ${week} 周（${weekDateRange(week)}）`;

    // 本课有课的课程（常规课 + 调课里本周也上的）+ 本周实验
    const active = (SCHEDULE.courses || []).filter((c) => weekActive(c.weeks, week));
    const exThisWeek = (SCHEDULE.experiments || []).filter((x) => x.week === week);

    // 组头日期（MM-DD）；节次→时刻（墨轩湖校区作息）
    const dayDate = (day) => {
      const base = new Date(scheduleWeekStart() + 'T00:00:00');
      const d = new Date(base.getTime() + ((week - 1) * 7 + (day - 1)) * 86400000);
      return String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    };
    const periodTime = (start, end) => {
      const tb = (SCHEDULE.times && SCHEDULE.times['墨轩湖校区']) || [];
      const t1 = tb.find((t) => t.s === start);
      const t2 = tb.find((t) => t.s === end);
      if (t1 && t2) return t1.start + ' - ' + t2.end;
      return '';
    };

    // 每节课一张彩色圆角卡片（深色主题：课程色标题 + 色条 + 节次徽标）
    const card = (c) => {
      const tm = periodTime(c.start, c.end);
      return `
      <div class="sc-card" style="--cc:${esc(courseColor(c.name))}">
        <div class="sc-no-badge">${c.start}-${c.end}</div>
        <div class="sc-card-main">
          <b class="sc-card-name">${esc(c.name)}</b>
          <span class="sc-card-time">第${c.start}-${c.end}节${tm ? ' · ' + esc(tm) : ''}</span>
          <small class="sc-card-meta">${esc((c.room || '').replace(/^[^\s]*\s/, ''))}${c.teacher ? ' · ' + esc(c.teacher) : ''}${c.weeks ? ' · ' + esc(String(c.weeks)) : ''}</small>
        </div>
      </div>`;
    };
    // 实验课不排版：当天分组内的简单一行（🧪 前缀、无彩色卡片）
    const expRow = (x) => `
      <div class="sc-exp-row">🧪 <b>${esc(x.name)}</b><span>第${x.start}-${x.end}节 · 第${x.week}周 · ${esc((x.room || '').replace(/^[^\s]*\s/, ''))}</span></div>`;

    // 按天分组（只显示本周有课/有实验的星期），今天高亮
    const groups = days.slice(1).map((name, i) => {
      const day = i + 1;
      const cs = active.filter((c) => c.day === day);
      const exs = exThisWeek.filter((x) => x.day === day);
      if (!cs.length && !exs.length) return '';
      return `
      <div class="sc-day${day === today ? ' sc-today' : ''}">
        <div class="sc-day-head">
          <span class="sc-day-name">${name}</span>
          <span class="sc-day-date">${dayDate(day)}</span>
          ${day === today ? '<span class="sc-day-badge">今天</span>' : ''}
          <span class="sc-day-count">${cs.length} 节课${exs.length ? ' · ' + exs.length + ' 项实验' : ''}</span>
        </div>${cs.map(card).join('')}${exs.map(expRow).join('')}
      </div>`;
    }).join('');

    $('#sc-grid').innerHTML = groups || '<p class="sc-empty">本周没有课程安排 🎉</p>';

    // 实验课表 / 实践周 / 调课记录（折叠区）
    const fold = (id, title, inner) => {
      const el = document.querySelector(id);
      if (el) el.innerHTML = `<details class="sc-fold-box"><summary>${title}</summary>${inner}</details>`;
    };
    fold('#sc-experiments', `🧪 实验课表（本周 ${exThisWeek.length} 项，点开看全学期 ${SCHEDULE.experiments.length} 项）`,
      `<div class="sc-list">${(SCHEDULE.experiments || []).map((x) => `
        <div class="sc-li"><b>${esc(x.name)}</b><span>${days[x.day]} · 第${x.start}-${x.end}节 · 第${x.week}周</span><i>${esc(x.room)}</i></div>`).join('')}</div>`);
    fold('#sc-practices', '🛠️ 实践周（课程设计 / 集中实践）',
      `<div class="sc-list">${(SCHEDULE.practices || []).map((x) => `
        <div class="sc-li"><b>${esc(x.name)}</b><span>${esc(x.weeks)}</span><i>${esc(x.teacher || '')}${x.kind ? ' · ' + esc(x.kind) : ''}</i></div>`).join('')}</div>`);
    fold('#sc-adjust', SCHEDULE.hasAdjust ? '📌 全学期调课记录' : '📌 调课记录',
      `<div class="sc-list">${(SCHEDULE.adjust || []).map((x) => `
        <div class="sc-li"><b>${esc(x.name)}</b><span>${days[x.day]} · 第${x.start}-${x.end}节 · ${esc(x.weeks)}${x.note ? '（' + esc(x.note) + '）' : ''}</span><i>${esc(x.room)}</i></div>`).join('') || '<div class="sc-li">暂无</div>'}</div>`);
  }

  function stepSchedule(delta) {
    const weeks = (SCHEDULE && SCHEDULE.weeks) || 18;
    const cur = (S.schedule.week || currentWeek()) + delta;
    S.schedule.week = Math.max(1, Math.min(weeks, cur));
    renderSchedule();
  }
  function goThisWeekSchedule() {
    S.schedule.week = currentWeek();
    renderSchedule();
  }

  /* ---------- 课程页：公式速记 + 习题案例 ---------- */
  function renderCourse() {
    const c = courseById(S.course.id);
    if (!c) { routeView('home'); return; }
    const nf = formulaCount(c);
    const nc = casesOf(c.id).length;

    // 课程头：封面横幅 + 课名/教材/简介 + 计数（--cc-plate：暗色主题下标题的每课浅色变体）
    const t = CC3D[c.id] || { plate: c.color, deep: c.color };
    $('#course-head').innerHTML = `
      <div class="co-head" style="--cc:${esc(c.color)};--cc-plate:${esc(t.plate)};--cc-deep:${esc(t.deep)}">
        ${c.cover ? `<img class="co-banner" src="${esc(c.cover)}" alt="${esc(c.name)} 封面" loading="lazy">` : ''}
        <div class="co-head-in">
          <div class="co-title-row">
            <span class="co-emoji">${c.emoji}</span>
            <span class="co-title">${esc(c.name)}</span>
          </div>
          <div class="co-sub">${esc(c.book)}${c.desc ? ' · ' + esc(c.desc) : ''}</div>
        </div>
      </div>`;

    // 双标签
    $('#course-tabs').innerHTML = `
      <a class="ctab ${S.course.tab === 'formula' ? 'active' : ''}" href="#/course/${esc(c.id)}">🧮 公式速记（${nf}）</a>
      <a class="ctab ${S.course.tab === 'cases' ? 'active' : ''}" href="#/course/${esc(c.id)}/cases">✏️ 习题练习（${nc}）</a>`;

    // 标签页显隐
    $('#co-formula-pane').classList.toggle('hidden', S.course.tab !== 'formula');
    $('#co-cases-pane').classList.toggle('hidden', S.course.tab !== 'cases');

    renderFormulaPane(c);
    renderCasesPane(c);
    // v5.3/v5.6 切课或返回时重置课程头为展开态（按当前滚动位置重新判断，不残留）
    syncCourseHeadCompact(true);
  }

  function renderFormulaPane(c) {
    // v4.6 翻卡记忆模式：替代公式列表
    if (S.flash.active) { renderFlashPane(c); return; }
    // v4.7 讲练翻卡模式：一公式配一例题
    if (S.pair.active) { renderPairPane(c); return; }
    // 搜索框是静态 DOM：只同步值，不重建（保住输入焦点）
    $('#cof-search').value = S.formula.q;
    $('#cof-favtoggle').classList.toggle('on', S.formula.favOnly);

    // v5.2 分类导航改为「折叠目录」：目录行 + 手风琴展开
    //   目录模式下隐藏 chips（目录本身就是导航）；筛选到单一分类时给「返回目录」
    const catsEl = $('#cof-cats');
    const dirMode = !S.formula.q && !S.formula.favOnly && S.formula.cat === 'all';
    if (dirMode) {
      catsEl.innerHTML = '';
      catsEl.style.display = 'none';
    } else {
      catsEl.style.display = '';
      const actCat = c.categories.find((x) => x.id === S.formula.cat);
      catsEl.innerHTML =
        '<span class="chip" data-setcat="all">📚 全部 / 返回目录</span>' +
        (actCat ? `<span class="chip on">${actCat.emoji} ${esc(actCat.name)}（${(actCat.formulas || []).length}）</span>` : '');
    }

    let list = allFormulas().filter((f) => f.course.id === c.id);
    if (S.formula.cat !== 'all') list = list.filter((f) => f.cat.id === S.formula.cat);
    if (S.formula.q) { const q = S.formula.q.toLowerCase(); list = list.filter((f) => formulaHaystack(f).indexOf(q) >= 0); }
    if (S.formula.favOnly) list = list.filter((f) => fav.formulas.has(f.id));

    if (dirMode) {
      // 目录：可展开单个分类（手风琴）；「全部展开」切回原来的分组全览
      // v5.3 收藏的分类置顶（★），并给每行一个收藏星星（不影响公式收藏）
      const ordered = c.categories.slice().sort((a, b) =>
        (fav.cats.has(b.id) ? 1 : 0) - (fav.cats.has(a.id) ? 1 : 0));
      const blocks = ordered.map((cat) => {
        const fs = list.filter((f) => f.cat.id === cat.id);
        if (S.formula.openAll) {
          return `
        <div class="cat-block">
          <div class="cat-head">
            ${cat.emoji} ${esc(cat.name)}
            ${cat.chapter ? `<span class="chip">📖 ${esc(cat.chapter)}</span>` : ''}
            <span class="chip">${fs.length} 条</span>
          </div>
          ${cat.intro ? `<p class="cat-intro">${esc(cat.intro)}</p>` : ''}
          ${fs.length ? cardsHTML(fs) : '<p class="loading">该分类暂无公式</p>'}
        </div>`;
        }
        const open = S.formula.openCat === cat.id;
        return `
        <div class="dir-row ${open ? 'open' : ''}" data-opencat="${esc(cat.id)}">
          <span class="dir-emoji">${cat.emoji}</span>
          <span class="dir-name">${esc(cat.name)}</span>
          <span class="dir-meta">${cat.chapter ? esc(cat.chapter) + ' · ' : ''}${fs.length} 条</span>
          <span class="dir-star ${fav.cats.has(cat.id) ? 'on' : ''}" data-dircat="${esc(cat.id)}" title="收藏该分类">${fav.cats.has(cat.id) ? '★' : '☆'}</span>
          <span class="dir-caret">▾</span>
        </div>
        ${open ? `<div class="dir-body">${cat.intro ? `<p class="cat-intro">${esc(cat.intro)}</p>` : ''}${fs.length ? cardsHTML(fs) : '<p class="loading">该分类暂无公式</p>'}</div>` : ''}`;
      }).join('');
      const favN = c.categories.filter((cat) => fav.cats.has(cat.id)).length;
      $('#cof-list').innerHTML = `
      <div class="cat-dir">
        <div class="dir-bar">
          <span>📖 ${c.categories.length} 个分类 · 共 ${formulaCount(c)} 条公式${favN ? ' · ★ ' + favN : ''}</span>
          <span class="chip" data-dirall="1">${S.formula.openAll ? '收起全部' : '全部展开'}</span>
        </div>
        ${blocks}
      </div>`;
    } else {
      $('#cof-list').innerHTML = cardsHTML(list, '没有找到匹配的公式，换个词试试' + (S.formula.favOnly ? '（或取消「只看收藏」）' : ''));
    }
  }

  function renderCasesPane(c) {
    $('#coc-search').value = S.cases.q;
    const list0 = casesOf(c.id);
    const noFilter = S.cases.cate === '全部' && S.cases.scene === '全部' && !S.cases.q;

    // 第二行 chips = 题型（始终显示）
    const types = ['全部'].concat(Array.from(new Set(list0.map((x) => x.type).filter((v) => v))));
    $('#coc-scenes').innerHTML = types.map((t) =>
      `<span class="chip ${S.cases.scene === t ? 'on' : ''}" data-casescene="${esc(t)}">${esc(t)}</span>`).join('');

    // v5.3 分类 chips：目录态隐藏（目录本身就是导航）；筛选态给「返回目录 + 当前分类」
    const catesEl = $('#coc-cates');
    if (noFilter) {
      catesEl.innerHTML = '';
      catesEl.style.display = 'none';
    } else {
      catesEl.style.display = '';
      const actName = S.cases.cate === '全部' ? '' : (catNameOf(c.id, S.cases.cate) || S.cases.cate);
      catesEl.innerHTML = '<span class="chip" data-casecate="全部">📚 全部 / 返回目录</span>' +
        (actName ? `<span class="chip on">${esc(actName)}</span>` : '');
    }

    let list = list0.slice();
    if (S.cases.cate !== '全部') list = list.filter((x) => x.cat === S.cases.cate);
    if (S.cases.scene !== '全部') list = list.filter((x) => x.type === S.cases.scene);
    if (S.cases.q) {
      const q = S.cases.q.toLowerCase();
      list = list.filter((x) =>
        (x.title + x.body + x.answer + x.step + (x.pitfall || '') + x.type + catNameOf(c.id, x.cat)).toLowerCase().indexOf(q) >= 0);
    }

    if (noFilter && list0.length) {
      // v5.3 习题页折叠目录：按知识点分类分组，点一行原地展开该分类习题
      const cats = c.categories.filter((cat) => list0.some((x) => x.cat === cat.id));
      const ordered = cats.slice().sort((a, b) => (fav.cats.has(b.id) ? 1 : 0) - (fav.cats.has(a.id) ? 1 : 0));
      const blocks = ordered.map((cat) => {
        const cs = list0.filter((x) => x.cat === cat.id);
        if (S.cases.openAll) {
          return `
        <div class="cat-block">
          <div class="cat-head">
            ${cat.emoji} ${esc(cat.name)}
            ${cat.chapter ? `<span class="chip">📖 ${esc(cat.chapter)}</span>` : ''}
            <span class="chip">${cs.length} 道</span>
          </div>
          ${cs.map(exerciseCardHTML).join('')}
        </div>`;
        }
        const open = S.cases.openCat === cat.id;
        return `
        <div class="dir-row ${open ? 'open' : ''}" data-caseopencat="${esc(cat.id)}">
          <span class="dir-emoji">${cat.emoji}</span>
          <span class="dir-name">${esc(cat.name)}</span>
          <span class="dir-meta">${cat.chapter ? esc(cat.chapter) + ' · ' : ''}${cs.length} 道</span>
          <span class="dir-star ${fav.cats.has(cat.id) ? 'on' : ''}" data-dircat="${esc(cat.id)}" title="收藏该分类">${fav.cats.has(cat.id) ? '★' : '☆'}</span>
          <span class="dir-caret">▾</span>
        </div>
        ${open ? `<div class="dir-body">${cs.map(exerciseCardHTML).join('')}</div>` : ''}`;
      }).join('');
      const favN = ordered.filter((cat) => fav.cats.has(cat.id)).length;
      $('#coc-list').innerHTML = `
      <div class="cat-dir">
        <div class="dir-bar">
          <span>📖 ${ordered.length} 个分类 · 共 ${list0.length} 道习题${favN ? ' · ★ ' + favN : ''}</span>
          <span class="chip" data-casedirall="1">${S.cases.openAll ? '收起全部' : '全部展开'}</span>
        </div>
        ${blocks}
      </div>`;
      return;
    }

    $('#coc-list').innerHTML = list.length
      ? list.map(exerciseCardHTML).join('')
      : `<p class="loading">${list0.length ? '没有找到匹配的习题，换个关键词试试' : '本课暂无配套习题，可先看「公式速记」，或到其他课程逛逛'}</p>`;
  }

  /* ---------- 卡片 ---------- */
  function cardsHTML(list, emptyMsg) {
    if (!list.length) return `<p class="loading">${emptyMsg || '没有找到匹配的公式，换个词试试'}</p>`;
    return `<div class="cards-wrap">${list.map(formulaCardHTML).join('')}</div>`;
  }
  function formulaCardHTML(f) {
    const isFav = fav.formulas.has(f.id);
    const pairCases = casesForFormula(f.id); // v4.7 讲练配对
    return `
      <article class="card formula-card" data-id="${esc(f.id)}">
        <div class="fc-head">
          <span class="chip course-chip">${f.course.emoji} ${esc(f.course.name)}</span>
          <span class="chip cat-chip" data-setcat="${esc(f.cat.id)}" title="只看该分类">${f.cat.emoji} ${esc(f.cat.name)}</span>
          <button class="favbtn ${isFav ? 'on' : ''}" data-type="formula" data-id="${esc(f.id)}">${isFav ? '★' : '☆'}</button>
        </div>
        <h3>${esc(f.title)}</h3>
        <pre class="fml">${esc(f.formula)}</pre>
        ${f.params ? `<div class="params">变量：${esc(f.params)}</div>` : ''}
        ${f.tip ? `<div class="tip">💡 ${esc(f.tip)}</div>` : ''}
        ${f.mnemonic ? `<div class="mnemonic">🗝️ ${esc(f.mnemonic)}</div>` : ''}
        ${pairCases.length ? `
        <div class="pair-links">
          ${pairCases.map((x) => `<button class="cc-fmlink" data-open-pair="${esc(x.id)}">📖 配套例题：${esc(x.title)}</button>`).join('')}
        </div>` : ''}
      </article>`;
  }
  // v3.12 习题卡：题干 + 题型 + 难度 + 「涉及公式」按钮（点击直达公式速记并高亮）
  function exerciseCardHTML(x) {
    const isFav = fav.cases.has(x.id);
    const catName = catNameOf(x.course, x.cat) || '';
    const links = (x.formulas || []).map((fid) => {
      const f = formulaById(fid);
      return f ? `<button class="cc-fmlink" data-goto-formula="${esc(f.id)}">${esc(f.title)}</button>` : '';
    }).join('');
    return `
      <article class="card case-card" data-id="${esc(x.id)}">
        <div class="cc-head">
          <span class="cc-name">✏️ ${esc(x.title)}</span>
          <span class="cc-badge">${esc(x.type)}</span>
        </div>
        <div class="cc-sub">${esc(catName)} · 难度 <span class="cc-diff">${stars(x.diff)}</span></div>
        <p class="highlight">📝 ${esc(x.body)}</p>
        ${links ? `<div class="cc-fmlinks">💡 涉及公式：${links}</div>` : ''}
        <div class="cc-meta">
          <span>📚 共 ${(x.formulas || []).length} 条搭配公式</span>
          <button class="favbtn ${isFav ? 'on' : ''}" data-type="case" data-id="${esc(x.id)}">${isFav ? '★' : '☆'}</button>
        </div>
        <div class="cc-open"><button data-open="${esc(x.id)}">查看答案与解析 ▸</button></div>
      </article>`;
  }

  /* ---------- 翻卡记忆（v4.6）：本课公式逐张背 ---------- */
  function startFlash(c) {
    const all = allFormulas().filter((f) => f.course.id === c.id);
    if (!all.length) return;
    // 洗牌（Fisher–Yates）
    const list = all.slice();
    for (let i = list.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = list[i]; list[i] = list[j]; list[j] = t;
    }
    S.flash = { active: true, list: list, idx: 0, known: 0 };
    $('#cof-flash').classList.add('on');
    renderFormulaPane(c);
  }
  function exitFlash(c) {
    S.flash = { active: false, list: [], idx: 0, known: 0 };
    const b = $('#cof-flash');
    if (b) b.classList.remove('on');
    if (c) renderFormulaPane(c);
  }
  function renderFlashPane(c) {
    const { list, idx } = S.flash;
    if (idx >= list.length) {
      $('#cof-list').innerHTML = `
        <div class="flash-wrap">
          <div class="flash-done">🎉 本轮完成！记住了 <b style="color:var(--ok)">${S.flash.known}/${list.length}</b> 条</div>
          <div class="flash-actions">
            <button class="btn" data-cmd="flash-again">🔄 再来一轮</button>
            <button class="btn" data-cmd="flash-exit">✕ 退出</button>
          </div>
        </div>`;
      return;
    }
    const f = list[idx];
    $('#cof-list').innerHTML = `
      <div class="flash-wrap">
        <div class="flash-progress">第 ${idx + 1} / ${list.length} 张 · 已记住 ${S.flash.known}</div>
        <div class="flash-card" data-cmd="flash-flip">
          <div class="flash-face flash-front">
            <div class="flash-q">${f.cat.emoji} ${esc(f.cat.name)}<b>${esc(f.title)}</b></div>
            <div class="flash-hint">点击翻开公式</div>
          </div>
          <div class="flash-face flash-back">
            <pre class="fml">${esc(f.formula)}</pre>
            ${f.params ? `<div class="params">变量：${esc(f.params)}</div>` : ''}
            ${f.tip ? `<div class="flash-tip">💡 ${esc(f.tip)}</div>` : ''}
          </div>
        </div>
        <div class="flash-actions">
          <button class="btn" data-cmd="flash-known">✓ 记住了</button>
          <button class="btn" data-cmd="flash-retry">✗ 再背一次</button>
          <button class="btn" data-cmd="flash-exit">✕ 退出</button>
        </div>
      </div>`;
  }
  function flashStep(c, known) {
    if (known) S.flash.known += 1;
    S.flash.idx += 1;
    renderFormulaPane(c);
  }

  /* ---------- 讲练翻卡（v4.7）：一个公式配一道配套例题 ---------- */
  function startPair(c) {
    // 只收录本课「有配套例题」的公式
    const all = allFormulas().filter((f) => f.course.id === c.id && casesForFormula(f.id).length);
    if (!all.length) return;
    // 洗牌（Fisher–Yates）
    const list = all.slice();
    for (let i = list.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = list[i]; list[i] = list[j]; list[j] = t;
    }
    S.pair = { active: true, list: list, idx: 0, known: 0 };
    $('#cof-pair').classList.add('on');
    renderFormulaPane(c);
  }
  function exitPair(c) {
    S.pair = { active: false, list: [], idx: 0, known: 0 };
    const b = $('#cof-pair');
    if (b) b.classList.remove('on');
    if (c) renderFormulaPane(c);
  }
  function renderPairPane(c) {
    const { list, idx } = S.pair;
    if (idx >= list.length) {
      $('#cof-list').innerHTML = `
        <div class="flash-wrap">
          <div class="flash-done">🎉 讲练完成！本课 <b style="color:var(--ok)">${S.pair.known}/${list.length}</b> 个公式配上了例题</div>
          <div class="flash-actions">
            <button class="btn" data-cmd="pair-again">🔄 再来一轮</button>
            <button class="btn" data-cmd="pair-exit">✕ 退出</button>
          </div>
        </div>`;
      return;
    }
    const f = list[idx];
    const pairCases = casesForFormula(f.id);
    // 倒退内联展示：正面=公式，背面=配套例题
    $('#cof-list').innerHTML = `
      <div class="flash-wrap">
        <div class="flash-progress">第 ${idx + 1} / ${list.length} 张 · 已记住 ${S.pair.known}${pairCases.length > 1 ? ` · 本公式配 ${pairCases.length} 道例题` : ''}</div>
        <div class="flash-card" data-cmd="pair-flip">
          <div class="flash-face flash-front">
            <div class="flash-q">${f.cat.emoji} ${esc(f.cat.name)}<b>${esc(f.title)}</b></div>
            <pre class="fml">${esc(f.formula)}</pre>
            ${f.tip ? `<div class="flash-tip">💡 ${esc(f.tip)}</div>` : ''}
            <div class="flash-hint">👆 点击翻面，看它被哪道例题用</div>
          </div>
          <div class="flash-face flash-back">
            <div class="flash-q">📖 配套例题 · <b>${pairCases.map((x, i) => (pairCases.length > 1 ? `${i + 1}. ` : '') + esc(x.title)).join('<br>')}</b></div>
            ${pairCases.slice(0, 2).map((x) => `
              <div class="pair-case">
                <div class="pair-body">📝 ${esc(x.body)}</div>
                ${x.answer ? `<div class="pair-ans">✅ ${esc(x.answer)}</div>` : ''}
                ${x.step ? `<div class="pair-step">🧭 ${esc(x.step)}</div>` : ''}
                ${x.pitfall ? `<div class="pair-pit">⚠️ ${esc(x.pitfall)}</div>` : ''}
              </div>`).join('')}
            ${pairCases.length > 2 ? `<div class="pair-more">… 共 ${pairCases.length} 道配套题</div>` : ''}
          </div>
        </div>
        <div class="flash-actions">
          <button class="btn" data-cmd="pair-known">✓ 记住了</button>
          <button class="btn" data-cmd="pair-retry">✗ 再背一次</button>
          <button class="btn" data-cmd="pair-exit">✕ 退出</button>
        </div>
      </div>`;
  }
  function pairStep(c, known) {
    if (known) S.pair.known += 1;
    S.pair.idx += 1;
    renderFormulaPane(c);
  }

      <style>
        body { font-family: "PingFang SC","Microsoft YaHei",sans-serif; padding: 28px; color: #1e293b; }
        h1 { font-size: 20px; margin: 0 0 4px; } h1 small { color:#64748b; font-size: 13px; font-weight:400; }
        .item { border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px 14px; margin: 12px 0; page-break-inside: avoid; }
        .item h3 { margin: 0 0 6px; font-size: 15px; }
        .fml { font-family: "Cambria Math","Times New Roman",serif; font-size: 14px; background: #f1f5f9; border-radius: 8px; padding: 8px 10px; white-space: pre-wrap; }

        .note { font-size: 12.5px; color: #b45309; margin-top: 4px; }
        pre { white-space: pre-wrap; word-break: break-word; }
      </style>`;
    let body = '';

      body = list.map((x) => `

          <h3>✏️ ${esc(x.title)}</h3>

        </div>`).join('') || '<p>本课暂无习题</p>';
    } else {
      const all = allFormulas().filter((f) => f.course.id === c.id);
      body = all.map((f) => `
        <div class="item">
          <h3>${f.cat.emoji} ${esc(f.title)}</h3>
          <pre class="fml">${esc(f.formula)}</pre>
          ${f.params ? `<div class="meta">变量：${esc(f.params)}</div>` : ''}

          ${f.mnemonic ? `<div class="note">🗝️ ${esc(f.mnemonic)}</div>` : ''}
        </div>`).join('') || '<p>本课暂无公式</p>';

    w.document.write('<!DOCTYPE html><html lang="zh-CN"><head>' + head + '</head><body>' +
      `<h1>${esc(c.name)} <small>${tab === 'cases' ? '习题（' + casesOf(c.id).length + ' 道）' : '公式速记（' + formulaCount(c) + ' 条）'} · 学习助手</small></h1>` +
      body + '</body></html>');
    w.document.close();
    setTimeout(() => { try { w.focus(); w.print(); } catch (e) { /* 忽略 */ } }, 300);
  }
  // v4.8 课表打印：整学期常规课 + 实验 + 实践 → 新窗口，可另存 PDF
  function printSchedule() {
    if (!SCHEDULE) return;
    const w = window.open('', '_blank');
    if (!w) return;
    const days = ['', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六', '星期日'];
    const head = `<meta charset="utf-8"><title>课表 · 学习助手</title>
      <style>
        body { font-family: "PingFang SC","Microsoft YaHei",sans-serif; padding: 24px; color: #1e293b; }
        h1 { font-size: 20px; margin: 0 0 4px; } h1 small { color:#64748b; font-size: 13px; font-weight:400; }
        h2 { font-size: 15px; margin: 18px 0 8px; color:#1d4ed8; }
        table { border-collapse: collapse; width: 100%; font-size: 12px; }
        th, td { border: 1px solid #e2e8f0; padding: 6px; vertical-align: top; text-align: center; }
        th { background: #f1f5f9; }
        .course { display: block; } .course b { font-size: 12.5px; }
        .course i, .course em { display: block; font-style: normal; font-size: 11px; color: #64748b; }
        .exp b { color:#b45309; }
      </style>`;
    const grid = [];
    const periods = [];
    const pushP = (it) => { for (let s = it.start; s <= it.end; s++) if (!periods.includes(s)) periods.push(s); };
    (SCHEDULE.courses || []).forEach(pushP);
    (SCHEDULE.experiments || []).forEach(pushP);
    periods.sort((a, b) => a - b);
    grid.push('<table><tr><th>节次</th>' + days.slice(1).map((d) => `<th>${d}</th>`).join('') + '</tr>');
    periods.forEach((s) => {
      const exs = (SCHEDULE.experiments || []).filter((x) => x.start <= s && s <= x.end);
      grid.push('<tr><td>' + s + '</td>' + days.slice(1).map((_, i) => {
        const day = i + 1;
        const cs = (SCHEDULE.courses || []).filter((c) => c.day === day && c.start <= s && s <= c.end);
        const ex = exs.filter((x) => x.day === day);
        const cards = cs.map((c) => `<span class="course"><b>${esc(c.name)}</b><i>${esc((c.room || '').replace(/^[^\s]*\s/, ''))}</i><em>${esc(c.weeks)}</em></span>`).join('') +
          ex.map((x) => `<span class="course exp"><b>🧪 ${esc(x.name)}</b><i>${esc((x.room || '').replace(/^[^\s]*\s/, ''))}</i><em>第${x.week}周实验</em></span>`).join('');
        return `<td>${cards}</td>`;
      }).join('') + '</tr>');
    });
    grid.push('</table>');
    const exp = `<h2>🧪 实验课表（${SCHEDULE.experiments.length} 项）</h2><table><tr><th>课程</th><th>时间</th><th>地点</th><th>教师</th></tr>` +
      (SCHEDULE.experiments || []).map((x) => `<tr><td>${esc(x.name)}</td><td>${days[x.day]} 第${x.start}-${x.end}节 · 第${x.week}周</td><td>${esc(x.room)}</td><td>${esc(x.teacher || '')}</td></tr>`).join('') + '</table>';
    const prac = `<h2>🛠️ 实践周</h2><table><tr><th>名称</th><th>周次</th><th>教师</th></tr>` +
      (SCHEDULE.practices || []).map((x) => `<tr><td>${esc(x.name)}</td><td>${esc(x.weeks)}</td><td>${esc(x.teacher || '')}</td></tr>`).join('') + '</table>';
    w.document.write('<!DOCTYPE html><html lang="zh-CN"><head>' + head + '</head><body>' +
      `<h1>${esc(SCHEDULE.term || '课表')} <small>${esc((SCHEDULE.name || '') + ' · ' + (SCHEDULE.student || ''))} · 学习助手</small></h1>` +
      grid.join('') + exp + prac + '</body></html>');
    w.document.close();
    setTimeout(() => { try { w.focus(); w.print(); } catch (e) { /* 忽略 */ } }, 300);
  }

      return f ? `<div class="m-formula">
        <pre class="fml">${esc(f.formula)}</pre>
        <button class="cc-fmlink" data-goto-formula="${esc(f.id)}">📌 ${esc(f.title)}：去公式速记定位</button>
      </div>` : '';
    }).join('');
    $('#modal-body').innerHTML = `
      <h2>✏️ ${esc(x.title)}</h2>
      <div class="meta">${esc(x.type)} · 难度 ${stars(x.diff)} · ${esc(catName)}</div>
      <div class="m-field"><h4>📝 题目</h4><p>${esc(x.body)}</p></div>
      ${fmls ? `<div class="m-field"><h4>📖 本题用到的公式（已与公式速记联动）</h4>${fmls}</div>` : ''}

  function closeModal() { $('#case-modal').classList.add('hidden'); }

  /* ---------- 公式联动：跳回公式速记并滚动高亮目标公式卡 ---------- */
  function gotoFormula(fid) {
    const f = formulaById(fid);
    if (!f) return;
    closeModal();
    S.flash = { active: false, list: [], idx: 0, known: 0 }; // 退出翻卡，避免残留
    S.pair = { active: false, list: [], idx: 0, known: 0 }; // v4.7 同样退出讲练
    keepQ = false;
    S.formula.q = '';
    S.formula.favOnly = false;
    // 先按公式所在课程路由（routeView 会重置筛选），再切到该公式分类后重绘，保证卡片可见
    goHash('#/course/' + f.course.id);
    S.formula.cat = f.cat.id;
    S.course.tab = 'formula';
    renderCourse();
    setTimeout(() => {
      const card = document.querySelector('#cof-list .formula-card[data-id="' + f.id + '"]');
      if (!card) return;
      try { card.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) { /* 忽略 */ }
      card.classList.add('fml-hl');
      setTimeout(() => card.classList.remove('fml-hl'), 2600);
    }, 80);
  }

  /* ---------- 事件 ---------- */
  // 站内跳转统一入口：显式设 hash（失败也不影响）+ 直接渲染，
  // 不依赖浏览器默认 hash 导航或 hashchange 事件——在任何预览沙盒里都点得动
  function onDocClick(e) {
    const t = e.target;

    // 底部 Tab 栏（小程序外壳）：公式/习题 Tab 指向当前（或第一门）课程
    const tab = t.closest('.mp-tab[data-tab]');
    if (tab) {
      const tb = tab.getAttribute('data-tab');
      const cid = S.course.id || (COURSES[0] && COURSES[0].id) || '';
      goHash(tb === 'home' ? '#/'
        : tb === 'schedule' ? '#/schedule'
        : tb === 'credits' ? '#/credits'
        : tb === 'formula' ? '#/course/' + cid
        : '#/course/' + cid + '/cases');
      return;
    }

    // 顶栏返回键
    if (t.closest('#mp-back')) { goHash('#/'); return; }

    // 站内 hash 链接（封面卡、标签页、返回首页等）：统一 preventDefault + goHash
    const link = t.closest('a[href^="#/"]');
    if (link) {
      if (typeof e.preventDefault === 'function') e.preventDefault();
      // v4.6 搜索结果：公式 → 跳课程并高亮定位；习题 → 跳课程习题页并打开弹窗
      const gf = link.getAttribute('data-goto-formula');
      if (gf) { gotoFormula(gf); return; }
      const gsx = link.getAttribute('data-open');
      if (gsx) {
        S.cases.cate = '全部'; S.cases.scene = '全部'; S.cases.q = '';
        const href = link.getAttribute('href') || '';
        goHash(href);
        renderCurrent();
        setTimeout(() => openExercise(gsx), 80);
        return;
      }
      goHash(link.getAttribute('href') || '#/');
      return;
    }

    // 收藏按钮
    const fb = t.closest('.favbtn');
    if (fb) { toggleFav(fb.dataset.type, fb.dataset.id); renderCurrent(); return; }

    // v5.3 目录行收藏分类（★）：只切收藏，不展开
    const dircat = t.closest('[data-dircat]');
    if (dircat) {
      const id = dircat.dataset.dircat;
      if (fav.cats.has(id)) fav.cats.delete(id); else fav.cats.add(id);
      saveFav();
      renderCourse();
      return;
    }

    // v5.2 折叠目录：点目录行展开/收起该分类（手风琴，一次只开一个）
    const dirRow = t.closest('[data-opencat]');
    if (dirRow) {
      const id = dirRow.dataset.opencat;
      S.formula.openCat = (S.formula.openCat === id) ? null : id;
      renderCourse();
      return;
    }
    if (t.closest('[data-dirall]')) {
      S.formula.openAll = !S.formula.openAll;
      S.formula.openCat = null;
      renderCourse();
      return;
    }

    // 课程页公式分类（chips + 卡内分类标签）
    const st = t.closest('[data-setcat]');
    if (st) {
      const id = st.dataset.setcat;
      S.formula.cat = id;
      if (id !== 'all') S.formula.openCat = id; // 回目录时定位到刚看的分类
      renderCourse();
      return;
    }

    // 「只看收藏」
    const ft = t.closest('#cof-favtoggle');
    if (ft) { S.formula.favOnly = !S.formula.favOnly; renderCourse(); return; }

    // v5.1 工具栏瘦身：「⋯」更多操作浮层（翻卡 / 讲练 / 打印）
    if (t.closest('#cof-more')) {
      const pop = $('#cof-more-pop');
      if (pop) pop.classList.toggle('hidden');
      return;
    }
    const morePop = $('#cof-more-pop');
    if (morePop) {
      // 点了菜单项 → 先收起浮层，再交给下面的翻卡/讲练/打印分支处理
      // 点了其它任何地方 → 收起浮层
      if (t.closest('#cof-more-pop button') || !t.closest('.more-menu')) morePop.classList.add('hidden');
    }

    // v4.6 翻卡记忆：翻卡 / 记住了 / 再背一次 / 再来一轮 / 退出
    if (t.closest('#cof-flash')) {
      const c = courseById(S.course.id);
      if (c) { if (S.flash.active) exitFlash(c); else startFlash(c); }
      return;
    }
    const flip = t.closest('[data-cmd="flash-flip"]');
    if (flip) { flip.classList.toggle('flipped'); return; }
    if (t.closest('[data-cmd="flash-known"]')) { flashStep(courseById(S.course.id), true); return; }
    if (t.closest('[data-cmd="flash-retry"]')) { flashStep(courseById(S.course.id), false); return; }
    if (t.closest('[data-cmd="flash-again"]')) { startFlash(courseById(S.course.id)); return; }
    if (t.closest('[data-cmd="flash-exit"]')) { exitFlash(courseById(S.course.id)); return; }

    // v4.7 讲练翻卡：进入/退出 / 翻面 / 记住了 / 再背一次 / 再来一轮
    if (t.closest('#cof-pair')) {
      const c = courseById(S.course.id);
      if (c) { if (S.pair.active) exitPair(c); else startPair(c); }
      return;
    }
    const pflip = t.closest('[data-cmd="pair-flip"]');
    if (pflip) { pflip.classList.toggle('flipped'); return; }
    if (t.closest('[data-cmd="pair-known"]')) { pairStep(courseById(S.course.id), true); return; }
    if (t.closest('[data-cmd="pair-retry"]')) { pairStep(courseById(S.course.id), false); return; }
    if (t.closest('[data-cmd="pair-again"]')) { startPair(courseById(S.course.id)); return; }
    if (t.closest('[data-cmd="pair-exit"]')) { exitPair(courseById(S.course.id)); return; }
    // 公式卡「配套例题」入口 → 打开习题弹窗
    const pok = t.closest('[data-open-pair]');
    if (pok) { openExercise(pok.getAttribute('data-open-pair')); return; }

    // v4.6 打印 / 导出本课公式或习题
    if (t.closest('#cof-print')) { const c = courseById(S.course.id); if (c) printCourse(c, 'formula'); return; }
    if (t.closest('#coc-print')) { const c = courseById(S.course.id); if (c) printCourse(c, 'cases'); return; }

    // v4.8 课表：切周 / 回本周 / 打印
    if (t.closest('#sc-prev')) { stepSchedule(-1); return; }
    if (t.closest('#sc-next')) { stepSchedule(1); return; }
    if (t.closest('#sc-today-btn')) { goThisWeekSchedule(); return; }
    if (t.closest('#sc-print')) { printSchedule(); return; }

    // v5.3 习题页折叠目录：展开/收起某分类 + 全部展开
    const caseRow = t.closest('[data-caseopencat]');
    if (caseRow) {
      const id = caseRow.dataset.caseopencat;
      S.cases.openCat = (S.cases.openCat === id) ? null : id;
      renderCourse();
      return;
    }
    if (t.closest('[data-casedirall]')) {
      S.cases.openAll = !S.cases.openAll;
      S.cases.openCat = null;
      renderCourse();
      return;
    }

    // 课程页案例分类 / 场景
    const ca = t.closest('#coc-cates .chip');
    if (ca) { S.cases.cate = ca.dataset.casecate; renderCourse(); return; }
    const sc = t.closest('#coc-scenes .chip');
    if (sc) { S.cases.scene = sc.dataset.casescene; renderCourse(); return; }

    // 习题答案弹窗
    const op = t.closest('[data-open]');
    if (op) { openExercise(op.dataset.open); return; }

    // 公式联动：习题卡/弹窗里的「涉及公式」→ 回公式速记并高亮该公式卡
    const gf = t.closest('[data-goto-formula]');
    if (gf) { gotoFormula(gf.dataset.gotoFormula); return; }

    // 学分页交互（v4.1）
    if (creditOnClick(t)) return;

    // 弹窗关闭
    if (t.closest('#modal-close') || t.id === 'case-modal') closeModal();
  }

  function creditOnClick(t) {

    if (df) {
      creditStore.del(df.dataset.del || (df.getAttribute && df.getAttribute('data-del')) || '');
      renderCredits();
      return true;
    }
    // 下载文件
    const dlc = t.closest('.cf-dl');

      if (rec) downloadFile(rec);

      const ii = $('#cred-import');

      return true;
    }

  /* ---------- 封面 3D 倾斜：整卡朝鼠标方向微微转动（纯 CSS 3D，事件委托） ---------- */
  (function coverTilt() {
    var MAX = 7; // 最大倾斜角（度）
    var cur = null;
    // 系统开启「减弱动态效果」时跳过鼠标倾斜，只保留静态 3D 立体
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    function applyTilt(v, x, y) {
      var r = v.getBoundingClientRect();
      var px = (x - r.left) / r.width - 0.5;   // -0.5（左）.. 0.5（右）
      var py = (y - r.top) / r.height - 0.5;   // -0.5（上）.. 0.5（下）
      var rx = -py * 2 * MAX;                  // 上下倾斜
      var ry = px * 2 * MAX;                   // 左右倾斜
      v.style.transform = 'translateY(-6px) rotateX(' + rx.toFixed(2) + 'deg) rotateY(' + ry.toFixed(2) + 'deg)';
    }
    function resetTilt(v) { v.style.transform = ''; }
    document.addEventListener('pointermove', function (e) {
      var v = e.target && e.target.closest ? e.target.closest('.c3d') : null;
      if (v) {
        if (cur && cur !== v) resetTilt(cur);
        cur = v;
        applyTilt(v, e.clientX, e.clientY);
      } else if (cur) {
        resetTilt(cur);
        cur = null;
      }
    }, { passive: true });
    document.addEventListener('pointerleave', function () {
      if (cur) { resetTilt(cur); cur = null; }
    });
    // 视图切换（回首页重绘）后丢弃旧容器引用，避免残留内联 transform
    document.addEventListener('click', function () {
      if (cur && !cur.isConnected) { cur = null; }
    });
  })();

  /* ---------- 初始化 ---------- */
  // 全局错误提示条：任何脚本报错都在页面底部可见，演示现场能自查'点了没反应'的原因
  window.addEventListener('error', (ev) => {
    try {
      const d = document.createElement('div');
      d.className = 'err-banner';
      d.textContent = '⚠️ 页面出了点问题：' + ((ev.message) || (ev.error && ev.error.message) || '未知错误');
      document.body.appendChild(d);
    } catch (e2) { /* ignore */ }
  });
  // 搜索框用事件委托（输入框在 DOM 中保持不重建，避免丢焦点）
  document.addEventListener('input', (e) => {
    const el = e.target;
    if (!el || !el.id) return;
    if (el.id === 'cof-search') { S.formula.q = el.value; renderCourse(); }
    else if (el.id === 'coc-search') { S.cases.q = el.value; renderCourse(); }
  });
  // 学分页：选择文件 / 导入备份（change 委托）
  document.addEventListener('change', (e) => {
    const el = e.target;
    if (!el || !el.id) return;
    if (el.id === 'cred-file') { handleCreditFiles(el.files, S.credits.pending); }
    else if (el.id === 'cred-import') { importCreditBackup(el.files && el.files[0]); }
  });
  // 学分页：把文件拖到类别卡片上归入该类别（事件委托，重绘后仍有效）
  document.addEventListener('dragover', (e) => {
    const card = e.target && e.target.closest ? e.target.closest('.credit-part') : null;
    if (!card) return;
    e.preventDefault();
    card.classList.add('drop');
  });
  document.addEventListener('dragleave', (e) => {
    const card = e.target && e.target.closest ? e.target.closest('.credit-part') : null;
    if (card) card.classList.remove('drop');
  });
  document.addEventListener('drop', (e) => {
    const card = e.target && e.target.closest ? e.target.closest('.credit-part') : null;
    if (!card || !e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
    e.preventDefault();
    card.classList.remove('drop');
    handleCreditFiles(e.dataTransfer.files, card.getAttribute('data-part') || '');
  });
  document.addEventListener('click', onDocClick);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
    // v4.6 全局搜索框（首页/搜索结果页顶部）：回车进入全站搜索
    if (e.key === 'Enter' && e.target && e.target.id === 'global-q') {
      const q = (e.target.value || '').trim();
      if (q) goHash('#/search?q=' + encodeURIComponent(q));
      else goHash('#/');
    }
  });
  // v4.6 首页搜索框输入实时同步到状态（搜索页顶部输入回车即搜索）
  document.addEventListener('input', (e) => {
    if (e.target && e.target.id === 'global-q') S.search.q = e.target.value;
  });
  window.addEventListener('hashchange', () => route());

  // v5.3 滚动时收起课程头（封面横幅与副标题让位给目录/公式）
  /* v5.6 滚动收起课程头（修复手机端"抽搐"）
     旧实现：跨过 56px 就收起 → 上方内容少掉约 135px → 整页上跳 → 滚动位置又落回阈值内
               → 展开 → 再收起，来回翻转，手指滑动时就一直抖。
     新规则：① 必须已完全滚过整个课程头（y > 展开高度 + 8）才收起；
             ② 收起瞬间用 scrollBy 补偿掉减少的高度，视觉位置不跳；
             ③ 只有回到最顶部（y <= 0）才展开，彻底消除阈值附近的反复触发。 */
  let headCompact = false;
  let headExpandedH = 0;

  function headApply(compact) {
    const head = $('#course-head');
    if (!head) return;
    const before = head.offsetHeight || 0;
    head.classList.toggle('compact', compact);
    const after = head.offsetHeight || 0;
    headCompact = compact;
    if (!compact) { headExpandedH = after; return; }
    const d = before - after; // 收起后减少的高度
    // 补偿掉减少的高度，视觉位置不跳；补偿引发的 scroll 事件不会再触发任何切换
    //（此时 y 仍远大于 0，两个分支都不成立），因此不需要额外的防抖。
    if (d > 0 && typeof window.scrollBy === 'function') window.scrollBy(0, -d);
  }

  function syncCourseHeadCompact(reset) {
    const head = $('#course-head');
    if (!head) return;
    if (reset) {
      head.classList.remove('compact');
      headCompact = false;
      headExpandedH = head.offsetHeight || 0;
    }
    if (!headExpandedH) headExpandedH = head.offsetHeight || 0;
    const y = window.scrollY || window.pageYOffset || 0;
    if (!headCompact && y > headExpandedH + 8) headApply(true);
    else if (headCompact && y <= 0) headApply(false);
  }

  window.addEventListener('scroll', () => syncCourseHeadCompact(false), { passive: true });

  creditStore.init().then(() => { if (S.view === 'credits') renderCredits(); });
  route();

  // PWA（v4.5）：注册 Service Worker——可添加到主屏幕、断网也能打开
  // file:// 离线单文件或隐私模式无法注册，静默跳过不打扰
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('./sw.js').catch(() => { /* 离线/受限环境忽略 */ });
  }
})();
</script>
</body>
</html>
